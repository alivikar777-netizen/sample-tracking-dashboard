<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Master Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SHEET_ID = "142xiSUpVUdMGkFkzvyFBCPp5M0J_0AtAdHlCsCUWqkg";

    const SHEET_TABS = [
      "All Samples",
      "Government Contract Sample",
      "Exhibitor & Attendee Samples",
      "EXhibitior Count",
      "Business Email List Samples",
      "Funding Samples",
      "Location Wise Email List",
      "Doctors - Specialist Email List",
      "Industry Email List",
      "Title Email List",
      "Technology Users Email List",
      "E-Commerce Samples"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState(SHEET_TABS[0]);
      const [samples, setSamples] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedLocations, setSelectedLocations] = useState([]);
      const [selectedSample, setSelectedSample] = useState(null);
      const [viewMode, setViewMode] = useState("grid");
      const [errorMsg, setErrorMsg] = useState("");

      useEffect(() => {
        fetchSheetData(activeTab);
      }, [activeTab]);

      const extractUrl = (str) => {
        if (!str) return '';
        const match = String(str).match(/https?:\/\/[^\s"']+/);
        return match ? match[0] : (String(str).startsWith('http') ? str : '');
      };

      const fetchSheetData = (tabName) => {
        setLoading(true);
        setErrorMsg("");

        // Multi-proxy endpoints to ensure zero CORS/Empty issue
        const encodedTab = encodeURIComponent(tabName);
        const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodedTab}`;
        const corsProxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(gvizUrl)}`;

        Papa.parse(corsProxyUrl, {
          download: true,
          header: false,
          skipEmptyLines: 'greedy',
          complete: (results) => {
            if (results.data && results.data.length > 0) {
              parseRows(results.data, tabName);
            } else {
              tryDirectFetch(gvizUrl, tabName);
            }
          },
          error: () => {
            tryDirectFetch(gvizUrl, tabName);
          }
        });
      };

      const tryDirectFetch = (gvizUrl, tabName) => {
        Papa.parse(gvizUrl, {
          download: true,
          header: false,
          skipEmptyLines: 'greedy',
          complete: (results) => {
            if (results.data && results.data.length > 0) {
              parseRows(results.data, tabName);
            } else {
              setSamples([]);
              setLoading(false);
              setErrorMsg("No records found in this sheet tab.");
            }
          },
          error: (err) => {
            setSamples([]);
            setLoading(false);
            setErrorMsg("Could not load sheet data. Make sure 'Publish to Web' is enabled in Google Sheets.");
          }
        });
      };

      const parseRows = (rawRows, tabName) => {
        let rowsToProcess = rawRows;

        // Skip header row if matches sample columns
        let startIndex = 0;
        if (rowsToProcess[0] && rowsToProcess[0].some(cell => {
          const str = String(cell).toLowerCase();
          return str.includes('sample') || str.includes('name') || str.includes('client') || str.includes('id') || str.includes('req');
        })) {
          startIndex = 1;
        }

        const formatted = rowsToProcess.slice(startIndex).filter(row => row.some(cell => String(cell).trim() !== '')).map((row, idx) => {
          const sampleId = row[0] ? String(row[0]).trim() : `SMP-${idx + 1}`;
          const project = row[1] ? String(row[1]).trim() : 'Yes';
          const date = row[2] ? String(row[2]).trim() : '';
          const sampleName = row[3] ? String(row[3]).trim() : (row[0] ? String(row[0]).trim() : `Record ${idx + 1}`);
          const rawSheetUrl = row[4] ? String(row[4]).trim() : '';
          const clientReq = row[5] ? String(row[5]).trim() : '-';
          const difficulty = row[6] ? String(row[6]).trim() : '-';
          const createdBy = row[7] ? String(row[7]).trim() : '-';
          const tags = row[8] ? String(row[8]).trim() : '-';
          const industry = row[9] ? String(row[9]).trim() : '-';
          const location = row[10] ? String(row[10]).trim() : '-';

          return {
            id: `${tabName}-${idx}`,
            sampleId,
            project,
            date,
            sampleName,
            sampleSheet: extractUrl(rawSheetUrl),
            clientRequirement: clientReq,
            researchDifficulty: difficulty,
            createdBy,
            tags,
            industry,
            location,
            tabName
          };
        });

        setSamples(formatted);
        setLoading(false);
      };

      const availableLocations = useMemo(() => {
        const locs = new Set();
        samples.forEach(s => {
          if (s.location && s.location !== '-' && s.location.trim() !== '') {
            locs.add(s.location.trim());
          }
        });
        return Array.from(locs);
      }, [samples]);

      const filteredSamples = useMemo(() => {
        return samples.filter(item => {
          const search = searchTerm.toLowerCase();
          const matchesSearch = 
            (item.sampleName && item.sampleName.toLowerCase().includes(search)) ||
            (item.sampleId && item.sampleId.toLowerCase().includes(search)) ||
            (item.location && item.location.toLowerCase().includes(search)) ||
            (item.industry && item.industry.toLowerCase().includes(search)) ||
            (item.clientRequirement && item.clientRequirement.toLowerCase().includes(search)) ||
            (item.tags && item.tags.toLowerCase().includes(search));

          const matchesLocation = selectedLocations.length === 0 || selectedLocations.includes(item.location);

          return matchesSearch && matchesLocation;
        });
      }, [samples, searchTerm, selectedLocations]);

      const toggleLocation = (loc) => {
        setSelectedLocations(prev => 
          prev.includes(loc) ? prev.filter(x => x !== loc) : [...prev, loc]
        );
      };

      return (
        <div class="min-h-screen flex flex-col bg-slate-100">
          {/* Header */}
          <header class="bg-slate-900 text-white sticky top-0 z-20 px-6 py-3 flex flex-wrap items-center justify-between gap-4 shadow-md">
            <div class="flex items-center space-x-3">
              <div class="p-2 bg-blue-600 text-white rounded-lg font-bold text-lg">ST</div>
              <div>
                <h1 class="text-lg font-bold leading-none">Sample Tracking Master Dashboard</h1>
                <p class="text-xs text-slate-400 mt-1">Live Multi-Tab Google Sheet Database</p>
              </div>
            </div>

            <div class="flex-1 max-w-lg">
              <input
                type="text"
                placeholder="🔍 Search ID, Name, Client Requirement, Tags, Location, Industry..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-400"
              />
            </div>

            <div class="flex items-center space-x-3">
              <button onClick={() => fetchSheetData(activeTab)} class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium border border-slate-700 flex items-center gap-1 transition">
                🔄 {loading ? 'Syncing...' : 'Sync Sheet'}
              </button>
              <button onClick={() => setViewMode(viewMode === 'grid' ? 'table' : 'grid')} class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg text-xs border border-slate-700 transition">
                {viewMode === 'grid' ? '📊 Table View' : '🎴 Grid View'}
              </button>
            </div>
          </header>

          {/* Tab Navigation Bar */}
          <div class="bg-white border-b border-slate-200 px-6 pt-2 pb-0 overflow-x-auto whitespace-nowrap shadow-sm">
            <div class="flex space-x-2">
              {SHEET_TABS.map((tab) => {
                const isActive = activeTab === tab;
                return (
                  <button
                    key={tab}
                    onClick={() => {
                      setActiveTab(tab);
                      setSelectedLocations([]);
                    }}
                    class={`px-4 py-2.5 rounded-t-lg text-xs font-bold transition flex items-center gap-2 border-b-2 ${
                      isActive 
                        ? 'bg-blue-50 text-blue-700 border-blue-600' 
                        : 'text-slate-600 hover:text-slate-900 border-transparent hover:bg-slate-50'
                    }`}
                  >
                    <span>📁</span>
                    <span>{tab}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div class="flex flex-1">
            {/* Sidebar */}
            <aside class="w-64 bg-white border-r border-slate-200 p-4 shrink-0 hidden md:block">
              <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                  <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Location Filter</h3>
                  {selectedLocations.length > 0 && (
                    <button onClick={() => setSelectedLocations([])} class="text-[11px] text-blue-600 font-bold hover:underline">Clear</button>
                  )}
                </div>

                {availableLocations.length > 0 ? (
                  <div class="space-y-1 max-h-96 overflow-y-auto pr-1">
                    {availableLocations.map(loc => (
                      <label key={loc} class="flex items-center space-x-2 py-1 text-xs text-slate-700 cursor-pointer hover:bg-slate-50 px-1.5 rounded">
                        <input
                          type="checkbox"
                          checked={selectedLocations.includes(loc)}
                          onChange={() => toggleLocation(loc)}
                          class="rounded text-blue-600 focus:ring-blue-500"
                        />
                        <span class="truncate">{loc}</span>
                      </label>
                    ))}
                  </div>
                ) : (
                  <p class="text-xs text-slate-400 italic">No specific locations listed in this tab.</p>
                )}
              </div>
            </aside>

            {/* Content */}
            <main class="flex-1 p-6">
              <div class="mb-4 flex flex-wrap justify-between items-center gap-2">
                <div>
                  <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <span>Active Tab:</span>
                    <span class="bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-full text-xs font-extrabold">{activeTab}</span>
                  </h2>
                  <p class="text-xs text-slate-500 mt-0.5">Showing {filteredSamples.length} records</p>
                </div>
              </div>

              {loading ? (
                <div class="flex justify-center items-center py-20 text-slate-500 font-medium">
                  <div class="flex items-center gap-3 bg-white px-6 py-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <span>Fetching live data from <b>"{activeTab}"</b>...</span>
                  </div>
                </div>
              ) : errorMsg ? (
                <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-6 text-center text-sm">
                  ⚠️ {errorMsg}
                </div>
              ) : filteredSamples.length === 0 ? (
                <div class="bg-white rounded-xl border border-slate-200 p-10 text-center text-slate-500">
                  📁 No matching records found in <b>"{activeTab}"</b>.
                </div>
              ) : viewMode === 'grid' ? (
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {filteredSamples.map(sample => (
                    <div 
                      key={sample.id} 
                      onClick={() => setSelectedSample(sample)}
                      class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between hover:border-blue-400 group"
                    >
                      <div>
                        <div class="flex justify-between items-start mb-2">
                          <div>
                            <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wide block">{sample.sampleId}</span>
                            <h2 class="font-bold text-sm text-slate-800 leading-snug group-hover:text-blue-600 transition">{sample.sampleName}</h2>
                          </div>
                          {sample.location && sample.location !== '-' && (
                            <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[10px] font-medium shrink-0 ml-2 border border-slate-200">
                              📍 {sample.location}
                            </span>
                          )}
                        </div>
                        
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 my-2">
                          <span class="text-[10px] font-bold text-slate-400 uppercase block">Client / Requirement:</span>
                          <p class="text-xs text-slate-700 line-clamp-2 font-medium">
                            {sample.clientRequirement !== '-' ? sample.clientRequirement : 'No requirement details'}
                          </p>
                        </div>

                        <div class="space-y-1 mt-2">
                          {sample.tags && sample.tags !== '-' && (
                            <div>
                              <span class="text-[10px] font-bold text-slate-400 uppercase block">Keywords / Tags:</span>
                              <span class="inline-block bg-blue-50 text-blue-700 text-[11px] px-2 py-0.5 rounded font-medium border border-blue-100 max-w-full truncate">
                                🏷️ {sample.tags}
                              </span>
                            </div>
                          )}

                          {sample.industry && sample.industry !== '-' && (
                            <div>
                              <span class="text-[10px] font-bold text-slate-400 uppercase block">Industry:</span>
                              <span class="text-xs text-slate-600 font-medium">{sample.industry}</span>
                            </div>
                          )}
                        </div>
                      </div>

                      <div class="pt-3 mt-3 border-t border-slate-100 flex justify-end items-center">
                        {sample.sampleSheet ? (
                          <a 
                            href={sample.sampleSheet} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            onClick={(e) => e.stopPropagation()} 
                            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm"
                          >
                            🔗 Open Sample Sheet ↗
                          </a>
                        ) : (
                          <span class="text-xs text-slate-400 italic">No Link</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
                  <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold text-xs uppercase">
                      <tr>
                        <th class="p-3">Sample ID</th>
                        <th class="p-3">Sample Name</th>
                        <th class="p-3">Client / Requirement</th>
                        <th class="p-3">Keywords / Tags</th>
                        <th class="p-3">Location</th>
                        <th class="p-3">Industry</th>
                        <th class="p-3">Sheet URL</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs">
                      {filteredSamples.map(sample => (
                        <tr key={sample.id} onClick={() => setSelectedSample(sample)} class="hover:bg-blue-50/50 cursor-pointer">
                          <td class="p-3 font-bold text-slate-900">{sample.sampleId}</td>
                          <td class="p-3 font-medium text-slate-800">{sample.sampleName}</td>
                          <td class="p-3 text-slate-600 max-w-xs truncate">{sample.clientRequirement}</td>
                          <td class="p-3 text-slate-700">{sample.tags}</td>
                          <td class="p-3">{sample.location}</td>
                          <td class="p-3">{sample.industry}</td>
                          <td class="p-3">
                            {sample.sampleSheet ? (
                              <a 
                                href={sample.sampleSheet} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                onClick={(e) => e.stopPropagation()} 
                                class="text-blue-600 hover:underline font-bold text-xs bg-blue-50 px-2 py-1 rounded border border-blue-200"
                              >
                                🔗 Open Sheet ↗
                              </a>
                            ) : (
                              <span class="text-slate-400 text-xs">-</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </main>
          </div>

          {/* Modal */}
          {selectedSample && (
            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-100">
                <button onClick={() => setSelectedSample(null)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-bold text-blue-600 uppercase">{selectedSample.sampleId}</span>
                  <span class="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded">{selectedSample.tabName}</span>
                </div>
                <h2 class="text-xl font-bold text-slate-900 mb-4">{selectedSample.sampleName}</h2>

                <div class="space-y-3 text-sm">
                  <div>
                    <h4 class="font-bold text-slate-500 text-xs uppercase">Client / Requirement:</h4>
                    <p class="text-slate-800 bg-slate-50 p-2.5 rounded-lg border border-slate-200 mt-1 font-medium">{selectedSample.clientRequirement}</p>
                  </div>

                  <div>
                    <h4 class="font-bold text-slate-500 text-xs uppercase">Keywords / Tags:</h4>
                    <p class="text-slate-800 bg-slate-50 p-2.5 rounded-lg border border-slate-200 mt-1 font-medium">{selectedSample.tags}</p>
                  </div>

                  <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs">
                    <div><span class="text-slate-400 block">Location:</span><span class="font-semibold text-slate-700">{selectedSample.location}</span></div>
                    <div><span class="text-slate-400 block">Industry:</span><span class="font-semibold text-slate-700">{selectedSample.industry}</span></div>
                    <div><span class="text-slate-400 block">Difficulty Index:</span><span class="font-semibold text-slate-700">{selectedSample.researchDifficulty}</span></div>
                    <div><span class="text-slate-400 block">Created By:</span><span class="font-semibold text-slate-700">{selectedSample.createdBy}</span></div>
                  </div>
                </div>

                <div class="mt-6 flex justify-between items-center">
                  {selectedSample.sampleSheet ? (
                    <a href={selectedSample.sampleSheet} target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg text-sm hover:bg-blue-700 shadow">
                      🔗 Open Sample Sheet ↗
                    </a>
                  ) : (
                    <span class="text-sm text-slate-400 italic">No Sheet Link Available</span>
                  )}
                  <button onClick={() => setSelectedSample(null)} class="px-4 py-2 bg-slate-200 text-slate-700 font-semibold rounded-lg text-sm">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
