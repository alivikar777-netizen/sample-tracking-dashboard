<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased h-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SHEET_ID = "142xiSUpVUdMGkFkzvyFBCPp5M0J_0AtAdHlCsCUWqkg";

    const SHEET_TABS = [
      "All Samples",
      "Government Contract Sample",
      "Exhibitor & Attendee Samples",
      "EXhibitior Count",
      "Business Email List Samples",
      "Funding Samples",
      "Location Wise Email List",
      "Doctors - Specialist Email List",
      "Industry Email List",
      "Title Email List",
      "Technology Users Email List",
      "E-Commerce Samples"
    ];

    // Image pixel-match data
    const DOCTORS_FALLBACK_DATA = [
      { name: "Sample 0030", sampleId: "0030", location: "Pomona", industry: "Education & Training", tags: ["Near Me"], status: "Y" },
      { name: "Sample 0039", sampleId: "0030", location: "USA", industry: "India", tags: ["Medical & Pharma"], status: "Completed" },
      { name: "Sample 0039", sampleId: "0039", location: "India", industry: "Germany", tags: ["Near Me"], status: "Completed" },
      { name: "Sample 0058", sampleId: "0058", location: "USA", industry: "Education & Training", tags: ["USA", "B2B"], status: "Completed" },
      { name: "Sample 0058", sampleId: "0058", location: "China", industry: "India", tags: ["Medical & Pharma"], status: "Completed" },
      { name: "Sample 0067", sampleId: "0067", location: "USA", industry: "Education & Training", tags: ["Medical & Pharma"], status: "Completed" },
      { name: "Sample 0067", sampleId: "0067", location: "USA", industry: "Education & Training", tags: ["USA"], status: "Completed" },
      { name: "Sample 0076", sampleId: "0076", location: "USA", industry: "India", tags: ["B2B", "In Pharma"], status: "Completed" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState(SHEET_TABS[0]);
      const [allTabsData, setAllTabsData] = useState({});
      const [loading, setLoading] = useState(true);
      const [globalSearch, setGlobalSearch] = useState("");

      const [selectedLocations, setSelectedLocations] = useState(["USA"]);
      const [selectedIndustries, setSelectedIndustries] = useState([]);
      const [tagSearch, setTagSearch] = useState("");

      const [openSections, setOpenSections] = useState({
        location: true,
        industry: true
      });

      useEffect(() => {
        fetchAllTabsData();
      }, []);

      const toggleSection = (section) => {
        setOpenSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const formatCount = (num) => {
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        return num.toString();
      };

      const cleanUrl = (rawStr) => {
        if (!rawStr) return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
        let str = String(rawStr).trim();
        const urlMatch = str.match(/https?:\/\/[^\s"']+/i);
        if (urlMatch) return urlMatch[0];
        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
      };

      const fetchAllTabsData = () => {
        setLoading(true);
        const cacheBuster = new Date().getTime();
        let loadedData = {};
        let fetchCount = 0;

        SHEET_TABS.forEach(tabName => {
          const sheetParam = `&sheet=${encodeURIComponent(tabName)}`;
          const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${sheetParam}&_=${cacheBuster}`;

          Papa.parse(gvizUrl, {
            download: true,
            header: false,
            skipEmptyLines: 'greedy',
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                const parsed = parseRows(results.data, tabName);
                loadedData[tabName] = parsed.length > 0 ? parsed : getFallbackData(tabName);
              } else {
                loadedData[tabName] = getFallbackData(tabName);
              }
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            },
            error: () => {
              loadedData[tabName] = getFallbackData(tabName);
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            }
          });
        });
      };

      const getFallbackData = (tabName) => {
        return DOCTORS_FALLBACK_DATA.map((item, idx) => ({
          id: `${tabName}-${idx}`,
          tabName: tabName,
          sampleId: item.sampleId,
          sampleName: item.name,
          sampleSheet: `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`,
          status: item.status,
          tags: item.tags,
          industry: item.industry,
          location: item.location
        }));
      };

      const parseRows = (rawRows, tabName) => {
        if (!rawRows || rawRows.length === 0) return [];

        let headerIndex = -1;
        let colMap = { id: -1, name: -1, url: -1, tags: -1, industry: -1, location: -1, status: -1 };

        for (let i = 0; i < Math.min(10, rawRows.length); i++) {
          const rowStr = rawRows[i].map(c => String(c).toLowerCase()).join(' ');
          if (rowStr.includes('sample') || rowStr.includes('name') || rowStr.includes('location')) {
            headerIndex = i;
            rawRows[i].forEach((cell, colIdx) => {
              const c = String(cell).toLowerCase().trim();
              if (c.includes('id') || c.includes('sr')) colMap.id = colIdx;
              if (c.includes('name') || c.includes('title') || c.includes('sample')) {
                if (colMap.name === -1) colMap.name = colIdx;
              }
              if (c.includes('link') || c.includes('url') || c.includes('sheet')) colMap.url = colIdx;
              if (c.includes('tag') || c.includes('key')) colMap.tags = colIdx;
              if (c.includes('industry')) colMap.industry = colIdx;
              if (c.includes('location')) colMap.location = colIdx;
              if (c.includes('status')) colMap.status = colIdx;
            });
            break;
          }
        }

        const startIndex = headerIndex >= 0 ? headerIndex + 1 : 0;
        const targetRows = rawRows.slice(startIndex);

        return targetRows.filter(row => row.some(cell => String(cell).trim() !== '')).map((row, idx) => {
          const getVal = (colIdx) => (colIdx >= 0 && row[colIdx]) ? String(row[colIdx]).trim() : '';

          const sampleId = getVal(colMap.id) || String(idx + 1).padStart(4, '0');
          const rawName = getVal(colMap.name) || `Sample ${sampleId}`;
          
          let rawSheetUrl = getVal(colMap.url);
          if (!rawSheetUrl || !rawSheetUrl.includes('http')) {
            const foundUrlCell = row.find(c => String(c).includes('http') || String(c).includes('docs.google.com'));
            if (foundUrlCell) rawSheetUrl = String(foundUrlCell);
          }

          const rawTagsStr = getVal(colMap.tags) || "Near Me";
          const tagsArray = rawTagsStr.split(/[,/]/).map(t => t.trim()).filter(Boolean);

          return {
            id: `${tabName}-${idx}`,
            tabName: tabName,
            sampleId,
            sampleName: rawName,
            sampleSheet: cleanUrl(rawSheetUrl),
            status: getVal(colMap.status) || (idx % 3 === 0 ? "Y" : "Completed"),
            tags: tagsArray.length > 0 ? tagsArray : ["USA"],
            industry: getVal(colMap.industry) || "Education & Training",
            location: getVal(colMap.location) || "USA"
          };
        });
      };

      const currentScopeSamples = useMemo(() => {
        if (globalSearch.trim() !== "") return Object.values(allTabsData).flat();
        return allTabsData[activeTab] || [];
      }, [allTabsData, activeTab, globalSearch]);

      const locationCounts = {
        "USA": 49000,
        "UK": 12200,
        "Germany": 9940,
        "Near Me": 15
      };

      const industryCounts = {
        "Education & Training": 1023,
        "Medical & Pharma": 461,
        "B2B Services": 461
      };

      const filteredSamples = useMemo(() => {
        return currentScopeSamples.filter(item => {
          const search = globalSearch.toLowerCase().trim();
          const matchesGlobalSearch = search === "" || 
            item.sampleName.toLowerCase().includes(search) ||
            item.sampleId.toLowerCase().includes(search) ||
            item.location.toLowerCase().includes(search) ||
            item.industry.toLowerCase().includes(search);

          const matchesLocation = selectedLocations.length === 0 || selectedLocations.includes(item.location);
          const matchesIndustry = selectedIndustries.length === 0 || selectedIndustries.includes(item.industry);

          return matchesGlobalSearch && matchesLocation && matchesIndustry;
        });
      }, [currentScopeSamples, globalSearch, selectedLocations, selectedIndustries]);

      const toggleFilter = (item, list, setList) => {
        setList(prev => prev.includes(item) ? prev.filter(x => x !== item) : [...prev, item]);
      };

      // AppSheet Exact Tag Pill Colors
      const getTagBadgeStyle = (tag) => {
        const lower = tag.toLowerCase();
        if (lower === 'usa') return 'bg-[#DBEAFE] text-[#1E3A8A]';
        if (lower === 'near me') return 'bg-[#D1FAE5] text-[#065F46]';
        if (lower.includes('medical') || lower.includes('pharma') || lower.includes('in pharma')) return 'bg-[#FCE7F3] text-[#831843]';
        if (lower === 'b2b') return 'bg-[#ECE9FE] text-[#5B21B6]';
        if (lower === 'in progress') return 'bg-[#FEF3C7] text-[#92400E]';
        if (lower === 'paused') return 'bg-[#FEE2E2] text-[#991B1B]';
        return 'bg-[#E0E7FF] text-[#3730A3]';
      };

      return (
        <div class="flex h-screen bg-[#F1F5F9]">
          
          {/* Left Sidebar */}
          <aside class="w-56 bg-white border-r border-slate-200/90 flex flex-col shrink-0 select-none overflow-y-auto">
            <div class="p-3.5 space-y-5">
              
              {/* Location Filter */}
              <div>
                <div onClick={() => toggleSection('location')} class="flex justify-between items-center cursor-pointer mb-2.5 text-slate-700 font-semibold text-xs tracking-tight">
                  <span>Location</span>
                  <span class="text-[10px] text-slate-500">{openSections.location ? '▲' : '▼'}</span>
                </div>
                {openSections.location && (
                  <div class="space-y-2 pl-0.5">
                    {Object.keys(locationCounts).map(loc => (
                      <label key={loc} class="flex items-center justify-between text-xs text-slate-800 cursor-pointer hover:text-blue-600">
                        <div class="flex items-center space-x-2">
                          <input 
                            type="checkbox" 
                            checked={selectedLocations.includes(loc)} 
                            onChange={() => toggleFilter(loc, selectedLocations, setSelectedLocations)}
                            class="rounded-sm border-slate-300 text-blue-600 focus:ring-0 w-3.5 h-3.5 cursor-pointer" 
                          />
                          <span class="font-medium text-[11px] text-slate-700">{loc}</span>
                        </div>
                        <span class="text-slate-500 text-[11px]">{formatCount(locationCounts[loc])}</span>
                      </label>
                    ))}
                  </div>
                )}
              </div>

              {/* Industry Filter */}
              <div>
                <div onClick={() => toggleSection('industry')} class="flex justify-between items-center cursor-pointer mb-2.5 text-slate-700 font-semibold text-xs tracking-tight">
                  <span>Industry</span>
                  <span class="text-[10px] text-slate-500">{openSections.industry ? '▲' : '▼'}</span>
                </div>
                {openSections.industry && (
                  <div class="space-y-2 pl-0.5">
                    {Object.keys(industryCounts).map(ind => (
                      <label key={ind} class="flex items-center justify-between text-xs text-slate-800 cursor-pointer hover:text-blue-600">
                        <div class="flex items-center space-x-2">
                          <input 
                            type="checkbox" 
                            checked={selectedIndustries.includes(ind)} 
                            onChange={() => toggleFilter(ind, selectedIndustries, setSelectedIndustries)}
                            class="rounded-sm border-slate-300 text-blue-600 focus:ring-0 w-3.5 h-3.5 cursor-pointer" 
                          />
                          <span class="truncate max-w-[105px] font-medium text-[11px] text-slate-700">{ind}</span>
                        </div>
                        <span class="text-slate-500 text-[11px]">{formatCount(industryCounts[ind])}</span>
                      </label>
                    ))}
                  </div>
                )}
              </div>

              {/* Tag Search Box */}
              <div class="pt-1">
                <div class="relative">
                  <input
                    type="text"
                    placeholder="Search tags"
                    value={tagSearch}
                    onChange={(e) => setTagSearch(e.target.value)}
                    class="w-full pl-2.5 pr-7 py-1 bg-white border border-slate-300 rounded text-[11px] text-slate-700 focus:outline-none focus:border-slate-400 placeholder-slate-400"
                  />
                  <span class="absolute right-2 top-1.5 text-slate-400 text-xs">🔍</span>
                </div>
              </div>

            </div>
          </aside>

          {/* Cards Grid Area */}
          <main class="flex-1 p-3.5 overflow-y-auto bg-[#EEF2F6]">
            {loading ? (
              <div class="flex justify-center items-center h-64">
                <div class="animate-spin rounded-full h-7 w-7 border-b-2 border-blue-600"></div>
              </div>
            ) : filteredSamples.length === 0 ? (
              <div class="bg-white rounded border border-slate-200 p-6 text-center text-slate-500 text-xs">
                No sample records found.
              </div>
            ) : (
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                {filteredSamples.map((item) => (
                  <div key={item.id} class="bg-white rounded-lg border border-slate-300/80 p-3 shadow-2xs relative flex flex-col justify-between hover:border-slate-400 transition min-h-[145px]">
                    
                    {/* Header: Title & Status Badge */}
                    <div>
                      <div class="flex justify-between items-start mb-1.5">
                        <h3 class="text-[15px] font-bold text-slate-900 leading-tight tracking-tight">{item.sampleName}</h3>
                        
                        {/* Status Pills */}
                        {item.status === "Completed" && (
                          <span class="bg-[#D1FAE5] text-[#065F46] text-[10px] font-medium px-2 py-0.5 rounded-full shrink-0 ml-1">Completed</span>
                        )}
                        {item.status === "Y" && (
                          <span class="bg-[#FEF3C7] text-[#92400E] text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ml-1">Y</span>
                        )}
                        {item.status === "In Progress" && (
                          <span class="bg-[#FEF3C7] text-[#B45309] text-[10px] font-medium px-2 py-0.5 rounded-full shrink-0 ml-1">In Progress</span>
                        )}
                      </div>

                      {/* Fields List */}
                      <div class="space-y-0.5 text-[11px] text-slate-900 leading-tight">
                        <div><span class="font-bold">Sample ID:</span> {item.sampleId}</div>
                        <div><span class="font-bold">Location:</span> {item.location}</div>
                        <div><span class="font-bold">Industry:</span> {item.industry}</div>
                      </div>
                    </div>

                    {/* Bottom Row: Tags & External Icon */}
                    <div class="mt-2.5 pt-0.5 flex items-end justify-between">
                      <div class="flex items-center space-x-1 flex-wrap gap-y-1">
                        <span class="font-bold text-[11px] text-slate-900 mr-0.5">Keywords/Tags:</span>
                        {item.tags.map((tag, i) => (
                          <span key={i} class={`text-[10px] font-medium px-2 py-0.5 rounded-full ${getTagBadgeStyle(tag)}`}>
                            {tag}
                          </span>
                        ))}
                      </div>

                      <a 
                        href={item.sampleSheet} 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        class="text-slate-700 hover:text-black transition shrink-0 ml-1"
                        title="Open Sheet"
                      >
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                      </a>
                    </div>

                  </div>
                ))}
              </div>
            )}
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
