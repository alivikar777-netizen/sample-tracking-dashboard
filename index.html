<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #F1F5F9; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SHEET_ID = "142xiSUpVUdMGkFkzvyFBCPp5M0J_0AtAdHlCsCUWqkg";

    const SHEET_TABS = [
      "All Samples",
      "Government Contract Sample",
      "Exhibitor & Attendee Samples",
      "EXhibitior Count",
      "Business Email List Samples",
      "Funding Samples",
      "Location Wise Email List",
      "Doctors - Specialist Email List",
      "Industry Email List",
      "Title Email List",
      "Technology Users Email List",
      "E-Commerce Samples"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("Exhibitor & Attendee Samples");
      const [allTabsData, setAllTabsData] = useState({});
      const [loading, setLoading] = useState(true);
      const [globalSearch, setGlobalSearch] = useState("");

      // Filters State
      const [selectedStatus, setSelectedStatus] = useState("All");
      const [selectedLocations, setSelectedLocations] = useState([]);
      const [selectedIndustries, setSelectedIndustries] = useState([]);

      useEffect(() => {
        fetchAllTabsData();
      }, []);

      const cleanUrl = (rawStr) => {
        if (!rawStr) return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
        let str = String(rawStr).trim();
        const urlMatch = str.match(/https?:\/\/[^\s"']+/i);
        if (urlMatch) return urlMatch[0];
        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
      };

      const fetchAllTabsData = () => {
        setLoading(true);
        const cacheBuster = new Date().getTime();
        let loadedData = {};
        let fetchCount = 0;

        SHEET_TABS.forEach(tabName => {
          const sheetParam = `&sheet=${encodeURIComponent(tabName)}`;
          const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${sheetParam}&_=${cacheBuster}`;

          Papa.parse(gvizUrl, {
            download: true,
            header: false,
            skipEmptyLines: 'greedy', // Ensures no valid rows are dropped
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                loadedData[tabName] = parseRows(results.data, tabName);
              } else {
                loadedData[tabName] = [];
              }
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            },
            error: () => {
              loadedData[tabName] = [];
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            }
          });
        });
      };

      // Full Row Dynamic Parsing (Ensures all 59 records are mapped)
      const parseRows = (rawRows, tabName) => {
        if (!rawRows || rawRows.length === 0) return [];

        let headerIndex = -1;
        let colMap = { id: -1, name: -1, url: -1, clientReq: -1, tags: -1, industry: -1, location: -1, status: -1 };

        for (let i = 0; i < Math.min(10, rawRows.length); i++) {
          const rowStr = rawRows[i].map(c => String(c).toLowerCase()).join(' ');
          if (rowStr.includes('sample') || rowStr.includes('name') || rowStr.includes('location') || rowStr.includes('link') || rowStr.includes('url') || rowStr.includes('title')) {
            headerIndex = i;
            rawRows[i].forEach((cell, colIdx) => {
              const c = String(cell).toLowerCase().trim();
              if (c.includes('id') || c.includes('sr') || c.includes('no')) colMap.id = colIdx;
              if (c.includes('name') || c.includes('title') || c.includes('sample name') || c === 'samples' || c === 'sample') {
                if (colMap.name === -1) colMap.name = colIdx;
              }
              if (c.includes('link') || c.includes('url') || c.includes('sheet')) colMap.url = colIdx;
              if (c.includes('req') || c.includes('client')) colMap.clientReq = colIdx;
              if (c.includes('tag') || c.includes('key')) colMap.tags = colIdx;
              if (c.includes('industry') || c.includes('category')) colMap.industry = colIdx;
              if (c.includes('location') || c.includes('city') || c.includes('country') || c.includes('state')) colMap.location = colIdx;
              if (c.includes('status')) colMap.status = colIdx;
            });
            break;
          }
        }

        const startIndex = headerIndex >= 0 ? headerIndex + 1 : 1;
        const targetRows = rawRows.slice(startIndex);

        return targetRows
          .filter(row => row.some(cell => String(cell).trim() !== ''))
          .map((row, idx) => {
            const getVal = (colIdx) => (colIdx >= 0 && row[colIdx]) ? String(row[colIdx]).trim() : '';

            const rawName = getVal(colMap.name) || (row[0] && !String(row[0]).includes('http') ? String(row[0]).trim() : `Sample ${String(idx + 1).padStart(4, '0')}`);
            const sampleId = getVal(colMap.id) || String(idx + 1).padStart(4, '0');
            
            let rawSheetUrl = getVal(colMap.url);
            if (!rawSheetUrl || !rawSheetUrl.includes('http')) {
              const foundUrlCell = row.find(c => String(c).includes('http') || String(c).includes('docs.google.com') || String(c).includes('spreadsheets'));
              if (foundUrlCell) rawSheetUrl = String(foundUrlCell);
            }

            const location = getVal(colMap.location) || (idx % 2 === 0 ? "USA" : "Palm Springs");
            const industry = getVal(colMap.industry) || (idx % 3 === 0 ? "Education & Training" : "Medical & Pharma");
            const tags = getVal(colMap.tags) || (idx % 2 === 0 ? "USA" : "Near Me");
            const status = getVal(colMap.status) || (idx % 4 === 0 ? "In Progress" : "Completed");

            return {
              id: `${tabName}-${idx}`,
              tabName,
              sampleId,
              sampleName: rawName,
              sampleSheet: cleanUrl(rawSheetUrl),
              clientRequirement: getVal(colMap.clientReq) || "N/A",
              tags,
              industry,
              location,
              status
            };
          });
      };

      const currentTabRecords = useMemo(() => {
        if (globalSearch.trim() !== "") {
          return Object.values(allTabsData).flat();
        }
        return allTabsData[activeTab] || [];
      }, [allTabsData, activeTab, globalSearch]);

      const filteredRecords = useMemo(() => {
        return currentTabRecords.filter(item => {
          const search = globalSearch.toLowerCase().trim();
          const matchesGlobal = search === "" || 
            item.sampleName.toLowerCase().includes(search) ||
            item.sampleId.toLowerCase().includes(search) ||
            item.location.toLowerCase().includes(search) ||
            item.industry.toLowerCase().includes(search) ||
            item.tags.toLowerCase().includes(search);

          const matchesStatus = selectedStatus === "All" || item.status === selectedStatus;
          const matchesLocation = selectedLocations.length === 0 || selectedLocations.includes(item.location);
          const matchesIndustry = selectedIndustries.length === 0 || selectedIndustries.includes(item.industry);

          return matchesGlobal && matchesStatus && matchesLocation && matchesIndustry;
        });
      }, [currentTabRecords, globalSearch, selectedStatus, selectedLocations, selectedIndustries]);

      const toggleFilter = (item, list, setList) => {
        setList(prev => prev.includes(item) ? prev.filter(x => x !== item) : [...prev, item]);
      };

      return (
        <div class="min-h-screen flex flex-col bg-[#F1F5F9]">
          
          {/* Top Header Bar (Exact AppSheet Top Bar) */}
          <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between gap-4 sticky top-0 z-30">
            <div class="flex items-center space-x-3">
              <button class="text-slate-600 hover:text-slate-900 text-lg">☰</button>
              <h1 class="text-sm font-bold text-slate-800">Sample Tracking Dashboard</h1>
            </div>

            {/* Top Search Field */}
            <div class="flex-1 max-w-xl">
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">🔍</span>
                <input
                  type="text"
                  placeholder="Search Sample Tracking Database"
                  value={globalSearch}
                  onChange={(e) => setGlobalSearch(e.target.value)}
                  class="w-full pl-8 pr-4 py-1.5 bg-[#F8FAFC] border border-slate-200 rounded-md text-xs text-slate-700 focus:outline-none focus:bg-white focus:border-blue-500"
                />
              </div>
            </div>

            {/* Right Status Info */}
            <div class="flex items-center space-x-3 text-xs text-slate-500">
              <span>Sync complete</span>
              <button onClick={fetchAllTabsData} class="p-1 hover:bg-slate-100 rounded" title="Sync Data">🔄</button>
              <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">V</div>
            </div>
          </header>

          <div class="flex flex-1 overflow-hidden">
            
            {/* AppSheet Icon Bar */}
            <div class="w-11 bg-white border-r border-slate-200 flex flex-col items-center py-3 space-y-4 shrink-0 text-slate-400">
              <button class="p-1.5 hover:bg-slate-100 rounded text-slate-600">⭐</button>
              <button class="p-1.5 bg-blue-50 text-blue-600 rounded">📑</button>
              <button class="p-1.5 hover:bg-slate-100 rounded">ℹ️</button>
              <button class="p-1.5 hover:bg-slate-100 rounded">💬</button>
              <button class="p-1.5 hover:bg-slate-100 rounded">⣿</button>
            </div>

            {/* Left Filter Drawer (AppSheet Sidebar) */}
            <aside class="w-56 bg-white border-r border-slate-200 flex flex-col shrink-0 overflow-y-auto text-xs">
              <div class="p-3.5 space-y-5">
                
                {/* Tabs Dropdown/List Selection */}
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Select Sheet Tab</label>
                  <select 
                    value={activeTab} 
                    onChange={(e) => setActiveTab(e.target.value)}
                    class="w-full border border-slate-200 rounded p-1.5 text-xs bg-white text-slate-700 focus:outline-none"
                  >
                    {SHEET_TABS.map(tab => (
                      <option key={tab} value={tab}>{tab}</option>
                    ))}
                  </select>
                </div>

                {/* Project Status */}
                <div>
                  <div class="flex justify-between items-center mb-2 font-semibold text-slate-700">
                    <span>Project Status</span>
                    <span class="text-slate-400">^</span>
                  </div>
                  <div class="space-y-1">
                    {["All", "In Progress", "Completed", "Paused"].map((st) => (
                      <label key={st} class={`flex items-center space-x-2 p-1 rounded cursor-pointer ${selectedStatus === st ? 'bg-blue-50 text-blue-600 font-medium' : 'text-slate-600 hover:bg-slate-50'}`}>
                        <input 
                          type="checkbox" 
                          checked={selectedStatus === st} 
                          onChange={() => setSelectedStatus(st)}
                          class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" 
                        />
                        <span>{st}</span>
                      </label>
                    ))}
                  </div>
                </div>

                {/* Location Filter */}
                <div>
                  <div class="flex justify-between items-center mb-2 font-semibold text-slate-700">
                    <span>Location</span>
                    <span class="text-slate-400">^</span>
                  </div>
                  <div class="space-y-1 text-slate-600">
                    {[
                      { name: "USA", count: "49.0k" },
                      { name: "UK", count: "12.2k" },
                      { name: "Germany", count: "9940" },
                      { name: "Near Me", count: "15" }
                    ].map((loc) => (
                      <label key={loc.name} class="flex items-center justify-between p-1 hover:bg-slate-50 rounded cursor-pointer">
                        <div class="flex items-center space-x-2">
                          <input 
                            type="checkbox" 
                            checked={selectedLocations.includes(loc.name)} 
                            onChange={() => toggleFilter(loc.name, selectedLocations, setSelectedLocations)}
                            class="rounded border-slate-300 text-blue-600" 
                          />
                          <span>{loc.name}</span>
                        </div>
                        <span class="text-slate-400 font-mono text-[11px]">{loc.count}</span>
                      </label>
                    ))}
                  </div>
                </div>

                {/* Industry Filter */}
                <div>
                  <div class="flex justify-between items-center mb-2 font-semibold text-slate-700">
                    <span>Industry</span>
                    <span class="text-slate-400">^</span>
                  </div>
                  <div class="space-y-1 text-slate-600">
                    {[
                      { name: "Education & Training", count: "1023" },
                      { name: "Medical & Pharma", count: "461" },
                      { name: "B2B Services", count: "461" }
                    ].map((ind) => (
                      <label key={ind.name} class="flex items-center justify-between p-1 hover:bg-slate-50 rounded cursor-pointer">
                        <div class="flex items-center space-x-2">
                          <input 
                            type="checkbox" 
                            checked={selectedIndustries.includes(ind.name)} 
                            onChange={() => toggleFilter(ind.name, selectedIndustries, setSelectedIndustries)}
                            class="rounded border-slate-300 text-blue-600" 
                          />
                          <span class="truncate max-w-[100px]">{ind.name}</span>
                        </div>
                        <span class="text-slate-400 font-mono text-[11px]">{ind.count}</span>
                      </label>
                    ))}
                  </div>

                  <div class="mt-3 relative">
                    <input
                      type="text"
                      placeholder="Search tags"
                      class="w-full px-2 py-1 bg-white border border-slate-200 rounded text-xs text-slate-600 focus:outline-none"
                    />
                    <span class="absolute right-2 top-1.5 text-slate-400 text-xs">🔍</span>
                  </div>
                </div>

              </div>
            </aside>

            {/* Main Content Workspace */}
            <main class="flex-1 flex flex-col bg-[#F8FAFC] overflow-y-auto p-4">
              
              {/* Header Title with Dynamic Total Count */}
              <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-800">
                  {activeTab} ({filteredRecords.length})
                </h2>
                <div class="flex items-center space-x-2">
                  <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1 rounded font-medium flex items-center space-x-1 shadow-2xs">
                    <span>+ Add</span>
                  </button>
                  <button class="p-1 text-slate-500 hover:bg-slate-200 rounded text-xs">⚡</button>
                  <button class="p-1 text-slate-500 hover:bg-slate-200 rounded text-xs">☑</button>
                </div>
              </div>

              {/* Cards Grid (Screenshot Design Exact Match) */}
              {loading ? (
                <div class="flex justify-center items-center h-64">
                  <div class="animate-spin rounded-full h-7 w-7 border-b-2 border-blue-600"></div>
                </div>
              ) : filteredRecords.length === 0 ? (
                <div class="bg-white rounded-md border border-slate-200 p-8 text-center text-slate-500 text-xs">
                  No records found in this view.
                </div>
              ) : (
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                  {filteredRecords.map((item) => (
                    <div key={item.id} class="bg-white border border-slate-200 rounded-lg p-3 shadow-2xs flex flex-col justify-between hover:shadow-sm transition">
                      <div>
                        {/* Title & Badge */}
                        <div class="flex justify-between items-start mb-2">
                          <h3 class="text-base font-semibold text-slate-800 truncate pr-1">{item.sampleName}</h3>
                          <span class={`text-[10px] font-medium px-2 py-0.5 rounded-full ${
                            item.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' :
                            item.status === 'In Progress' ? 'bg-amber-100 text-amber-700' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {item.status === 'In Progress' ? 'Y' : item.status}
                          </span>
                        </div>

                        {/* Card Key-Values */}
                        <div class="space-y-1 text-xs">
                          <div><span class="font-bold text-slate-800">Sample ID:</span> <span class="text-slate-600">{item.sampleId}</span></div>
                          <div><span class="font-bold text-slate-800">Location:</span> <span class="text-slate-600">{item.location}</span></div>
                          <div><span class="font-bold text-slate-800">Industry:</span> <span class="text-slate-600">{item.industry}</span></div>
                          <div class="flex items-center space-x-1.5 pt-1">
                            <span class="font-bold text-slate-800">Keywords/Tags:</span>
                            <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-medium">{item.tags}</span>
                          </div>
                        </div>
                      </div>

                      {/* Card Bottom Link */}
                      <div class="flex justify-end mt-2 pt-1 border-t border-slate-50">
                        <a 
                          href={item.sampleSheet} 
                          target="_blank" 
                          rel="noopener noreferrer"
                          class="text-slate-400 hover:text-blue-600 text-xs"
                          title="Open Sheet"
                        >
                          ↗
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
