<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse for CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_SAMPLES = [
      { id: "Sample 0001", sampleId: "0001", project: "Y", date: "2024-03-01", sampleName: "Sample 0001", sampleSheet: "https://docs.google.com/spreadsheets/d/137QAuenLEQXOcea2PmojxQWEbou7pKr1FunNjXxjud0/edit", clientRequirement: "High Priority Tech Research", researchDifficulty: "High", createdBy: "Admin", tags: "USA", industry: "Education & Training", location: "USA", clientNote: "Requires full analysis", salesNote: "Demo scheduled", status: "Completed" },
      { id: "Sample 0012", sampleId: "0012", project: "Y", date: "2024-03-02", sampleName: "Sample 0012", sampleSheet: "https://docs.google.com/spreadsheets/d/137QAuenLEQXOcea2PmojxQWEbou7pKr1FunNjXxjud0/edit", clientRequirement: "Market Expansion", researchDifficulty: "Medium", createdBy: "John", tags: "In Progress", industry: "Education & Training", location: "Palm Springs", clientNote: "Awaiting approval", salesNote: "Follow up next week", status: "In Progress" },
      { id: "Sample 0021", sampleId: "0021", project: "N", date: "2024-03-03", sampleName: "Sample 0021", sampleSheet: "https://docs.google.com/spreadsheets/d/137QAuenLEQXOcea2PmojxQWEbou7pKr1FunNjXxjud0/edit", clientRequirement: "Regional Survey", researchDifficulty: "Low", createdBy: "Sarah", tags: "Near Me", industry: "India", location: "USA", clientNote: "Standard sample", salesNote: "Closed deal", status: "Completed" },
      { id: "Sample 0022", sampleId: "0022", project: "Y", date: "2024-03-04", sampleName: "Sample 0022", sampleSheet: "", clientRequirement: "Local Business Analysis", researchDifficulty: "Low", createdBy: "Admin", tags: "USA, Paused", industry: "Education & Training", location: "Pomona", clientNote: "On hold by client", salesNote: "Paused contract", status: "Paused" },
      { id: "Sample 0030", sampleId: "0030", project: "Y", date: "2024-03-05", sampleName: "Sample 0030", sampleSheet: "", clientRequirement: "Training Data", researchDifficulty: "Medium", createdBy: "John", tags: "Near Me", industry: "Education & Training", location: "Pomona", clientNote: "Good response rate", salesNote: "Renewal pending", status: "Completed" },
      { id: "Sample 0039", sampleId: "0039", project: "N", date: "2024-03-06", sampleName: "Sample 0039", sampleSheet: "", clientRequirement: "Pharma Clinical Trials", researchDifficulty: "High", createdBy: "Dr. Alex", tags: "Medical & Pharma", industry: "India", location: "USA", clientNote: "Strict NDA required", salesNote: "High value deal", status: "Completed" },
      { id: "Sample 0058", sampleId: "0058", project: "Y", date: "2024-03-07", sampleName: "Sample 0058", sampleSheet: "", clientRequirement: "B2B SaaS Metrics", researchDifficulty: "Medium", createdBy: "Sarah", tags: "USA, B2B", industry: "Education & Training", location: "USA", clientNote: "Verified leads", salesNote: "Upsold package", status: "Completed" },
      { id: "Sample 0067", sampleId: "0067", project: "N", date: "2024-03-08", sampleName: "Sample 0067", sampleSheet: "", clientRequirement: "Education Sector Data", researchDifficulty: "Low", createdBy: "Admin", tags: "Medical & Pharma", industry: "Education & Training", location: "USA", clientNote: "Public domain dataset", salesNote: "Free sample given", status: "Completed" }
    ];

    function App() {
      const [samples, setSamples] = useState(INITIAL_SAMPLES);
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedStatuses, setSelectedStatuses] = useState([]);
      const [selectedLocations, setSelectedLocations] = useState([]);
      const [selectedIndustries, setSelectedIndustries] = useState([]);
      const [tagFilterSearch, setTagFilterSearch] = useState("");
      const [selectedSample, setSelectedSample] = useState(null);
      const [viewMode, setViewMode] = useState("grid");

      const filteredSamples = useMemo(() => {
        return samples.filter(item => {
          const matchesSearch = 
            item.sampleName?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.sampleId?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.location?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.industry?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.tags?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.clientRequirement?.toLowerCase().includes(searchTerm.toLowerCase());

          const matchesStatus = selectedStatuses.length === 0 || selectedStatuses.includes(item.status);
          const matchesLocation = selectedLocations.length === 0 || selectedLocations.includes(item.location);
          const matchesIndustry = selectedIndustries.length === 0 || selectedIndustries.includes(item.industry);

          return matchesSearch && matchesStatus && matchesLocation && matchesIndustry;
        });
      }, [samples, searchTerm, selectedStatuses, selectedLocations, selectedIndustries]);

      const toggleFilter = (type, val) => {
        const updateList = (prev) => prev.includes(val) ? prev.filter(x => x !== val) : [...prev, val];
        if (type === 'status') setSelectedStatuses(updateList);
        if (type === 'location') setSelectedLocations(updateList);
        if (type === 'industry') setSelectedIndustries(updateList);
      };

      return (
        <div class="min-h-screen flex flex-col bg-slate-100">
          {/* Header */}
          <header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-3 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-3">
              <div class="p-2 bg-blue-600 text-white rounded-lg font-bold">ST</div>
              <h1 class="text-xl font-bold text-slate-800">Sample Tracking Dashboard</h1>
            </div>

            <div class="flex-1 max-w-xl mx-8">
              <input
                type="text"
                placeholder="Search Sample ID, Name, Location, Tags..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                class="w-full pl-4 pr-4 py-2 bg-slate-100 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <div class="flex items-center space-x-3">
              <button onClick={() => setViewMode(viewMode === 'grid' ? 'table' : 'grid')} class="px-3 py-2 bg-slate-200 text-slate-700 font-medium rounded-lg text-sm">
                {viewMode === 'grid' ? ' Table View' : ' Grid View'}
              </button>
            </div>
          </header>

          <div class="flex flex-1">
            {/* Sidebar Filters */}
            <aside class="w-64 bg-white border-r border-slate-200 p-4 shrink-0 hidden md:block">
              <div class="mb-6">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Project Status</h3>
                {['All', 'In Progress', 'Completed', 'Paused'].map(st => (
                  <label key={st} class="flex items-center space-x-2 py-1 text-sm text-slate-700 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={st === 'All' ? selectedStatuses.length === 0 : selectedStatuses.includes(st)}
                      onChange={() => st === 'All' ? setSelectedStatuses([]) : toggleFilter('status', st)}
                      class="rounded text-blue-600"
                    />
                    <span>{st}</span>
                  </label>
                ))}
              </div>

              <div class="mb-6">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Location</h3>
                {['USA', 'UK', 'Germany', 'Near Me', 'Palm Springs', 'Pomona'].map(loc => (
                  <label key={loc} class="flex items-center justify-between py-1 text-sm text-slate-700 cursor-pointer">
                    <div class="flex items-center space-x-2">
                      <input
                        type="checkbox"
                        checked={selectedLocations.includes(loc)}
                        onChange={() => toggleFilter('location', loc)}
                        class="rounded text-blue-600"
                      />
                      <span>{loc}</span>
                    </div>
                  </label>
                ))}
              </div>
            </aside>

            {/* Main Content Area */}
            <main class="flex-1 p-6">
              <div class="mb-4 flex justify-between items-center">
                <p class="text-sm text-slate-500">Showing <span class="font-bold text-slate-800">{filteredSamples.length}</span> samples</p>
              </div>

              {viewMode === 'grid' ? (
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {filteredSamples.map(sample => (
                    <div key={sample.id} class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition relative flex flex-col justify-between">
                      <div>
                        <div class="flex justify-between items-start mb-2">
                          <h2 class="font-bold text-lg text-slate-800">{sample.sampleName}</h2>
                          <span class={`px-2 py-0.5 rounded-full text-xs font-semibold ${
                            sample.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' :
                            sample.status === 'In Progress' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'
                          }`}>
                            {sample.status}
                          </span>
                        </div>
                        <div class="text-xs text-slate-500 space-y-1 mb-3">
                          <p><span class="font-semibold text-slate-700">Sample ID:</span> {sample.sampleId}</p>
                          <p><span class="font-semibold text-slate-700">Location:</span> {sample.location}</p>
                          <p><span class="font-semibold text-slate-700">Industry:</span> {sample.industry}</p>
                        </div>
                      </div>

                      <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
                        <span class="inline-block bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded-md font-medium">
                          {sample.tags}
                        </span>
                        {sample.sampleSheet && (
                          <a href={sample.sampleSheet} target="_blank" class="text-blue-600 text-xs font-semibold hover:underline">
                            View Sheet ↗
                          </a>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
                  <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                      <tr>
                        <th class="p-3">Sample ID</th>
                        <th class="p-3">Sample Name</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Location</th>
                        <th class="p-3">Industry</th>
                        <th class="p-3">Sheet</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      {filteredSamples.map(sample => (
                        <tr key={sample.id} class="hover:bg-slate-50">
                          <td class="p-3 font-semibold">{sample.sampleId}</td>
                          <td class="p-3">{sample.sampleName}</td>
                          <td class="p-3">
                            <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">{sample.status}</span>
                          </td>
                          <td class="p-3">{sample.location}</td>
                          <td class="p-3">{sample.industry}</td>
                          <td class="p-3">
                            {sample.sampleSheet && <a href={sample.sampleSheet} target="_blank" class="text-blue-600 underline text-xs">Sheet Link</a>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
