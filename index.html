<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PapaParse for CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      const [samples, setSamples] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedLocations, setSelectedLocations] = useState([]);
      const [selectedSample, setSelectedSample] = useState(null);
      const [viewMode, setViewMode] = useState("grid");

      useEffect(() => {
        fetchSheetData();
      }, []);

      const extractUrl = (str) => {
        if (!str) return '';
        const match = String(str).match(/https?:\/\/[^\s"']+/);
        return match ? match[0] : (String(str).startsWith('http') ? str : '');
      };

      const fetchSheetData = () => {
        setLoading(true);
        const sheetId = "137QAuenLEQXOcea2PmojxQWEbou7pKr1FunNjXxjud0";
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;

        Papa.parse(csvUrl, {
          download: true,
          header: false, // Turn off header parsing to rely on exact column indexes
          skipEmptyLines: true,
          complete: (results) => {
            if (results.data && results.data.length > 0) {
              const rawRows = results.data;
              
              // Check if row 0 is header
              const startIndex = (rawRows[0][0] && rawRows[0][0].toLowerCase().includes('sample')) ? 1 : 0;

              const formatted = rawRows.slice(startIndex).map((row, idx) => {
                // Column A = 0, B = 1, C = 2, D = 3, E = 4, F = 5, G = 6, H = 7, I = 8, J = 9, K = 10
                const sampleId = row[0] ? String(row[0]).trim() : `SMP-${idx + 1}`;
                const project = row[1] ? String(row[1]).trim() : 'Yes';
                const date = row[2] ? String(row[2]).trim() : '';
                const sampleName = row[3] ? String(row[3]).trim() : `Sample ${idx + 1}`;
                const rawSheetUrl = row[4] ? String(row[4]).trim() : '';
                const clientReq = row[5] ? String(row[5]).trim() : '-';
                const difficulty = row[6] ? String(row[6]).trim() : '-';
                const createdBy = row[7] ? String(row[7]).trim() : '-';
                const tags = row[8] ? String(row[8]).trim() : '-';
                const industry = row[9] ? String(row[9]).trim() : '-';
                const location = row[10] ? String(row[10]).trim() : '-';

                return {
                  id: idx.toString(),
                  sampleId,
                  project,
                  date,
                  sampleName,
                  sampleSheet: extractUrl(rawSheetUrl),
                  clientRequirement: clientReq,
                  researchDifficulty: difficulty,
                  createdBy,
                  tags,
                  industry,
                  location
                };
              });

              setSamples(formatted);
            }
            setLoading(false);
          },
          error: (err) => {
            console.error("CSV Fetch Error:", err);
            setLoading(false);
          }
        });
      };

      const filteredSamples = useMemo(() => {
        return samples.filter(item => {
          const matchesSearch = 
            (item.sampleName && item.sampleName.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.sampleId && item.sampleId.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.location && item.location.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.industry && item.industry.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.clientRequirement && item.clientRequirement.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.tags && item.tags.toLowerCase().includes(searchTerm.toLowerCase()));

          const matchesLocation = selectedLocations.length === 0 || selectedLocations.includes(item.location);

          return matchesSearch && matchesLocation;
        });
      }, [samples, searchTerm, selectedLocations]);

      const toggleLocation = (loc) => {
        setSelectedLocations(prev => 
          prev.includes(loc) ? prev.filter(x => x !== loc) : [...prev, loc]
        );
      };

      return (
        <div class="min-h-screen flex flex-col bg-slate-100">
          {/* Header */}
          <header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-3 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-3">
              <div class="p-2 bg-blue-600 text-white rounded-lg font-bold text-lg">ST</div>
              <div>
                <h1 class="text-xl font-bold text-slate-800 leading-none">Sample Tracking Dashboard</h1>
                <p class="text-xs text-slate-500 mt-0.5">Live Google Sheet Database</p>
              </div>
            </div>

            <div class="flex-1 max-w-xl mx-6">
              <input
                type="text"
                placeholder="🔍 Search Sample ID, Name, Requirement, Tags, Location..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                class="w-full px-4 py-2 bg-slate-100 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <div class="flex items-center space-x-3">
              <button onClick={fetchSheetData} class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium border border-slate-300 flex items-center gap-1">
                🔄 {loading ? 'Syncing...' : 'Sync Sheet'}
              </button>
              <button onClick={() => setViewMode(viewMode === 'grid' ? 'table' : 'grid')} class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-sm border border-slate-300">
                {viewMode === 'grid' ? '📊 Table View' : '🎴 Grid View'}
              </button>
            </div>
          </header>

          <div class="flex flex-1">
            {/* Sidebar Filters */}
            <aside class="w-64 bg-white border-r border-slate-200 p-4 shrink-0 hidden md:block">
              <div class="mb-6">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Location</h3>
                {['United States', 'New Zealand', 'Australia', 'United Kingdom', 'United Arab Emirates', 'Brazil'].map(loc => (
                  <label key={loc} class="flex items-center space-x-2 py-1 text-sm text-slate-700 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={selectedLocations.includes(loc)}
                      onChange={() => toggleLocation(loc)}
                      class="rounded text-blue-600"
                    />
                    <span>{loc}</span>
                  </label>
                ))}
              </div>
            </aside>

            {/* Main Content */}
            <main class="flex-1 p-6">
              <div class="mb-4 flex justify-between items-center">
                <p class="text-sm text-slate-600">Total <span class="font-bold text-slate-900">{filteredSamples.length}</span> sample records loaded</p>
              </div>

              {loading ? (
                <div class="flex justify-center items-center py-20 text-slate-500 font-medium">
                  ⏳ Loading database from Google Sheet...
                </div>
              ) : viewMode === 'grid' ? (
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {filteredSamples.map(sample => (
                    <div 
                      key={sample.id} 
                      onClick={() => setSelectedSample(sample)}
                      class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between hover:border-blue-400"
                    >
                      <div>
                        <div class="flex justify-between items-start mb-2">
                          <div>
                            <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wide block">{sample.sampleId}</span>
                            <h2 class="font-bold text-base text-slate-800 leading-snug">{sample.sampleName}</h2>
                          </div>
                          {sample.location && sample.location !== '-' && (
                            <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[11px] font-medium shrink-0 ml-2">
                              📍 {sample.location}
                            </span>
                          )}
                        </div>
                        
                        {/* Requirement Box */}
                        <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 my-2">
                          <span class="text-[10px] font-bold text-slate-400 uppercase block">Client / Requirement:</span>
                          <p class="text-xs text-slate-700 line-clamp-2 font-medium">
                            {sample.clientRequirement !== '-' ? sample.clientRequirement : 'No requirement details'}
                          </p>
                        </div>

                        {/* Keywords / Tags */}
                        <div class="mt-2">
                          <span class="text-[10px] font-bold text-slate-400 uppercase block mb-0.5">Keywords / Tags:</span>
                          <span class="inline-block bg-blue-50 text-blue-700 text-xs px-2 py-0.5 rounded font-medium border border-blue-100">
                            🏷️ {sample.tags}
                          </span>
                        </div>
                      </div>

                      <div class="pt-3 mt-3 border-t border-slate-100 flex justify-end items-center">
                        {sample.sampleSheet ? (
                          <a 
                            href={sample.sampleSheet} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            onClick={(e) => e.stopPropagation()} 
                            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm"
                          >
                            🔗 Open Sample Sheet ↗
                          </a>
                        ) : (
                          <span class="text-xs text-slate-400 italic">No Sheet Link</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
                  <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                      <tr>
                        <th class="p-3">Sample ID</th>
                        <th class="p-3">Sample Name</th>
                        <th class="p-3">Client / Requirement</th>
                        <th class="p-3">Keywords / Tags</th>
                        <th class="p-3">Location</th>
                        <th class="p-3">Sample Sheet</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      {filteredSamples.map(sample => (
                        <tr key={sample.id} onClick={() => setSelectedSample(sample)} class="hover:bg-blue-50/50 cursor-pointer">
                          <td class="p-3 font-bold text-slate-900">{sample.sampleId}</td>
                          <td class="p-3 font-medium text-slate-800">{sample.sampleName}</td>
                          <td class="p-3 text-slate-600 max-w-xs truncate">{sample.clientRequirement}</td>
                          <td class="p-3 text-xs">{sample.tags}</td>
                          <td class="p-3">{sample.location}</td>
                          <td class="p-3">
                            {sample.sampleSheet ? (
                              <a 
                                href={sample.sampleSheet} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                onClick={(e) => e.stopPropagation()} 
                                class="text-blue-600 hover:underline font-bold text-xs bg-blue-50 px-2 py-1 rounded border border-blue-200"
                              >
                                🔗 Open URL ↗
                              </a>
                            ) : (
                              <span class="text-slate-400 text-xs">-</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </main>
          </div>

          {/* Sample Detail Modal */}
          {selectedSample && (
            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-100">
                <button onClick={() => setSelectedSample(null)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                <span class="text-xs font-bold text-blue-600 uppercase">{selectedSample.sampleId}</span>
                <h2 class="text-xl font-bold text-slate-900 mb-4">{selectedSample.sampleName}</h2>

                <div class="space-y-3 text-sm">
                  <div>
                    <h4 class="font-bold text-slate-500 text-xs uppercase">Client / Requirement:</h4>
                    <p class="text-slate-800 bg-slate-50 p-2.5 rounded-lg border border-slate-200 mt-1 font-medium">{selectedSample.clientRequirement}</p>
                  </div>

                  <div>
                    <h4 class="font-bold text-slate-500 text-xs uppercase">Keywords / Tags:</h4>
                    <p class="text-slate-800 bg-slate-50 p-2.5 rounded-lg border border-slate-200 mt-1 font-medium">{selectedSample.tags}</p>
                  </div>

                  <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <div><span class="text-slate-400 text-xs block">Location:</span><span class="font-semibold text-slate-700">{selectedSample.location}</span></div>
                    <div><span class="text-slate-400 text-xs block">Industry:</span><span class="font-semibold text-slate-700">{selectedSample.industry}</span></div>
                    <div><span class="text-slate-400 text-xs block">Difficulty Index:</span><span class="font-semibold text-slate-700">{selectedSample.researchDifficulty}</span></div>
                    <div><span class="text-slate-400 text-xs block">Created By:</span><span class="font-semibold text-slate-700">{selectedSample.createdBy}</span></div>
                  </div>
                </div>

                <div class="mt-6 flex justify-between items-center">
                  {selectedSample.sampleSheet ? (
                    <a href={selectedSample.sampleSheet} target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg text-sm hover:bg-blue-700 shadow">
                      🔗 Open Sample Sheet ↗
                    </a>
                  ) : (
                    <span class="text-sm text-slate-400 italic">No Sheet Link Available</span>
                  )}
                  <button onClick={() => setSelectedSample(null)} class="px-4 py-2 bg-slate-200 text-slate-700 font-semibold rounded-lg text-sm">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
