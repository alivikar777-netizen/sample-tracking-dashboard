<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SHEET_ID = "142xiSUpVUdMGkFkzvyFBCPp5M0J_0AtAdHlCsCUWqkg";

    const SHEET_TABS = [
      "All Samples",
      "Government Contract Sample",
      "Exhibitor & Attendee Samples",
      "EXhibitior Count",
      "Business Email List Samples",
      "Funding Samples",
      "Location Wise Email List",
      "Doctors - Specialist Email List",
      "Industry Email List",
      "Title Email List",
      "Technology Users Email List",
      "E-Commerce Samples"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState(SHEET_TABS[0]);
      const [allTabsData, setAllTabsData] = useState({});
      const [loading, setLoading] = useState(true);
      const [globalSearch, setGlobalSearch] = useState("");

      // Filter selections
      const [selectedLocations, setSelectedLocations] = useState([]);
      const [selectedIndustries, setSelectedIndustries] = useState([]);
      const [selectedTags, setSelectedTags] = useState([]);

      // Section open/close states
      const [openSections, setOpenSections] = useState({
        location: true,
        industry: true,
        tags: true
      });

      // Expand/Collapse "See More" states
      const [showAllLocations, setShowAllLocations] = useState(false);
      const [showAllIndustries, setShowAllIndustries] = useState(false);
      const [showAllTags, setShowAllTags] = useState(false);

      // Search queries for individual filters
      const [locationSearch, setLocationSearch] = useState("");
      const [industrySearch, setIndustrySearch] = useState("");
      const [tagSearch, setTagSearch] = useState("");

      // Fetch all tabs data initially to allow instant global search across all 12 tabs
      useEffect(() => {
        fetchAllTabsData();
      }, []);

      const toggleSection = (section) => {
        setOpenSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const formatCount = (num) => {
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        return num.toString();
      };

      const cleanUrl = (rawStr) => {
        if (!rawStr) return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
        let str = String(rawStr).trim();
        const urlMatch = str.match(/https?:\/\/[^\s"']+/i);
        if (urlMatch) return urlMatch[0];

        if (str.includes('docs.google.com') || str.includes('spreadsheets')) {
          if (!str.startsWith('http')) return 'https://' + str;
          return str;
        }

        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
      };

      const fetchAllTabsData = () => {
        setLoading(true);
        const cacheBuster = new Date().getTime();
        let loadedData = {};
        let fetchCount = 0;

        SHEET_TABS.forEach(tabName => {
          const sheetParam = `&sheet=${encodeURIComponent(tabName)}`;
          const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${sheetParam}&_=${cacheBuster}`;

          Papa.parse(gvizUrl, {
            download: true,
            header: false,
            skipEmptyLines: 'greedy',
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                loadedData[tabName] = parseRows(results.data, tabName);
              } else {
                loadedData[tabName] = [];
              }
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            },
            error: () => {
              loadedData[tabName] = [];
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            }
          });
        });
      };

      const parseRows = (rawRows, tabName) => {
        if (!rawRows || rawRows.length === 0) return [];

        let headerIndex = -1;
        let colMap = { id: -1, name: -1, url: -1, clientReq: -1, tags: -1, industry: -1, location: -1 };

        for (let i = 0; i < Math.min(10, rawRows.length); i++) {
          const rowStr = rawRows[i].map(c => String(c).toLowerCase()).join(' ');
          if (rowStr.includes('sample') || rowStr.includes('name') || rowStr.includes('location') || rowStr.includes('link') || rowStr.includes('url') || rowStr.includes('title')) {
            headerIndex = i;
            rawRows[i].forEach((cell, colIdx) => {
              const c = String(cell).toLowerCase().trim();
              if (c.includes('id') || c.includes('sr') || c.includes('no')) colMap.id = colIdx;
              if (c.includes('name') || c.includes('title') || c.includes('sample name') || c === 'sample') {
                if (colMap.name === -1) colMap.name = colIdx;
              }
              if (c.includes('link') || c.includes('url') || c.includes('sheet')) colMap.url = colIdx;
              if (c.includes('req') || c.includes('client')) colMap.clientReq = colIdx;
              if (c.includes('tag') || c.includes('key')) colMap.tags = colIdx;
              if (c.includes('industry') || c.includes('category')) colMap.industry = colIdx;
              if (c.includes('location') || c.includes('city') || c.includes('country') || c.includes('state')) colMap.location = colIdx;
            });
            break;
          }
        }

        const startIndex = headerIndex >= 0 ? headerIndex + 1 : 0;
        const targetRows = rawRows.slice(startIndex);

        return targetRows.filter(row => row.some(cell => String(cell).trim() !== '')).map((row, idx) => {
          const getVal = (colIdx) => (colIdx >= 0 && row[colIdx]) ? String(row[colIdx]).trim() : '';

          const rawName = getVal(colMap.name) || (row[0] && !String(row[0]).includes('http') ? String(row[0]).trim() : `Sample Record ${idx + 1}`);
          const sampleId = getVal(colMap.id) || rawName;
          
          let rawSheetUrl = getVal(colMap.url);
          if (!rawSheetUrl || !rawSheetUrl.includes('http')) {
            const foundUrlCell = row.find(c => String(c).includes('http') || String(c).includes('docs.google.com') || String(c).includes('spreadsheets'));
            if (foundUrlCell) {
              rawSheetUrl = String(foundUrlCell);
            }
          }

          const location = getVal(colMap.location);
          const industry = getVal(colMap.industry);
          const tags = getVal(colMap.tags);
          const clientReq = getVal(colMap.clientReq);

          return {
            id: `${tabName}-${idx}`,
            tabName: tabName,
            sampleId,
            sampleName: rawName,
            sampleSheet: cleanUrl(rawSheetUrl),
            clientRequirement: clientReq,
            tags: tags,
            industry: industry,
            location: location,
            projectStatus: 'Completed'
          };
        });
      };

      // Current scope samples (All tabs if global search query exists, else active tab)
      const currentScopeSamples = useMemo(() => {
        if (globalSearch.trim() !== "") {
          return Object.values(allTabsData).flat();
        }
        return allTabsData[activeTab] || [];
      }, [allTabsData, activeTab, globalSearch]);

      // Aggregations for Sidebar Filters
      const locationCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.location) counts[s.location] = (counts[s.location] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const industryCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.industry) counts[s.industry] = (counts[s.industry] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const tagCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.tags) counts[s.tags] = (counts[s.tags] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      // Filtered lists for sidebar
      const filteredLocations = useMemo(() => {
        return Object.keys(locationCounts).filter(loc => 
          loc.toLowerCase().includes(locationSearch.toLowerCase())
        );
      }, [locationCounts, locationSearch]);

      const filteredIndustries = useMemo(() => {
        return Object.keys(industryCounts).filter(ind => 
          ind.toLowerCase().includes(industrySearch.toLowerCase())
        );
      }, [industryCounts, industrySearch]);

      const filteredTagsList = useMemo(() => {
        return Object.keys(tagCounts).filter(tag => 
          tag.toLowerCase().includes(tagSearch.toLowerCase())
        );
      }, [tagCounts, tagSearch]);

      // Select All Toggle Handlers
      const toggleSelectAllLocations = () => {
        const allSelected = filteredLocations.every(loc => selectedLocations.includes(loc));
        if (allSelected) {
          setSelectedLocations(prev => prev.filter(loc => !filteredLocations.includes(loc)));
        } else {
          setSelectedLocations(prev => Array.from(new Set([...prev, ...filteredLocations])));
        }
      };

      const toggleSelectAllIndustries = () => {
        const allSelected = filteredIndustries.every(ind => selectedIndustries.includes(ind));
        if (allSelected) {
          setSelectedIndustries(prev => prev.filter(ind => !filteredIndustries.includes(ind)));
        } else {
          setSelectedIndustries(prev => Array.from(new Set([...prev, ...filteredIndustries])));
        }
      };

      const toggleSelectAllTags = () => {
        const allSelected = filteredTagsList.every(tag => selectedTags.includes(tag));
        if (allSelected) {
          setSelectedTags(prev => prev.filter(tag => !filteredTagsList.includes(tag)));
        } else {
          setSelectedTags(prev => Array.from(new Set([...prev, ...filteredTagsList])));
        }
      };

      // Main Filtered Results
      const filteredSamples = useMemo(() => {
        return currentScopeSamples.filter(item => {
          const search = globalSearch.toLowerCase().trim();
          const matchesGlobalSearch = search === "" || 
            (item.sampleName && item.sampleName.toLowerCase().includes(search)) ||
            (item.sampleId && item.sampleId.toLowerCase().includes(search)) ||
            (item.location && item.location.toLowerCase().includes(search)) ||
            (item.industry && item.industry.toLowerCase().includes(search)) ||
            (item.tags && item.tags.toLowerCase().includes(search)) ||
            (item.tabName && item.tabName.toLowerCase().includes(search));

          const matchesLocation = selectedLocations.length === 0 || (item.location && selectedLocations.includes(item.location));
          const matchesIndustry = selectedIndustries.length === 0 || (item.industry && selectedIndustries.includes(item.industry));
          const matchesTags = selectedTags.length === 0 || (item.tags && selectedTags.includes(item.tags));

          return matchesGlobalSearch && matchesLocation && matchesIndustry && matchesTags;
        });
      }, [currentScopeSamples, globalSearch, selectedLocations, selectedIndustries, selectedTags]);

      const toggleFilter = (item, list, setList) => {
        setList(prev => prev.includes(item) ? prev.filter(x => x !== item) : [...prev, item]);
      };

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        setGlobalSearch(""); // Reset search when switching tab explicitly
        setSelectedLocations([]);
        setSelectedIndustries([]);
        setSelectedTags([]);
        setLocationSearch("");
        setIndustrySearch("");
        setTagSearch("");
      };

      return (
        <div class="min-h-screen flex flex-col bg-[#F8FAFC]">
          {/* Header */}
          <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between gap-4 sticky top-0 z-30 shadow-sm">
            <div class="flex items-center space-x-3">
              <div class="p-1.5 bg-blue-600 text-white rounded font-bold text-sm">ST</div>
              <h1 class="text-base font-semibold text-slate-800">Sample Tracking Dashboard</h1>
            </div>

            <div class="flex-1 max-w-xl">
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">🔍</span>
                <input
                  type="text"
                  placeholder="Search across all 12 tabs..."
                  value={globalSearch}
                  onChange={(e) => setGlobalSearch(e.target.value)}
                  class="w-full pl-9 pr-4 py-1.5 bg-slate-100/80 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:bg-white focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <div class="flex items-center space-x-2 text-xs text-slate-500">
              <span>Sync complete</span>
              <button onClick={fetchAllTabsData} class="p-1.5 hover:bg-slate-100 rounded-full border border-slate-200" title="Refresh Data">🔄</button>
            </div>
          </header>

          {/* 12 Tabs Bar */}
          <div class="bg-white border-b border-slate-200 px-6 overflow-x-auto whitespace-nowrap shadow-2xs">
            <div class="flex space-x-1 py-1">
              {SHEET_TABS.map((tab) => {
                const isActive = activeTab === tab && globalSearch.trim() === "";
                return (
                  <button
                    key={tab}
                    onClick={() => handleTabChange(tab)}
                    class={`px-3 py-2 text-xs font-medium rounded-md transition ${
                      isActive 
                        ? 'bg-blue-50 text-blue-600 font-semibold border-b-2 border-blue-600' 
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    {tab}
                  </button>
                );
              })}
            </div>
          </div>

          <div class="flex flex-1">
            {/* Sidebar Filters */}
            <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 select-none">
              <div class="p-4 space-y-5 overflow-y-auto flex-1">
                
                {/* Location Filter */}
                <div class="border-b border-slate-100 pb-4">
                  <div 
                    onClick={() => toggleSection('location')} 
                    class="flex justify-between items-center cursor-pointer mb-2 text-slate-800 font-semibold text-sm"
                  >
                    <span>Location</span>
                    <span class="text-xs text-slate-400">{openSections.location ? '▲' : '▼'}</span>
                  </div>

                  {openSections.location && (
                    <div class="space-y-2 mt-2">
                      {filteredLocations.length === 0 ? (
                        <p class="text-xs text-slate-400 italic">No locations available</p>
                      ) : (
                        <>
                          <label class="flex items-center justify-between text-xs text-blue-600 font-semibold cursor-pointer hover:bg-blue-50 p-1 rounded border-b border-slate-100 mb-1">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={filteredLocations.length > 0 && filteredLocations.every(loc => selectedLocations.includes(loc))} 
                                onChange={toggleSelectAllLocations}
                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" 
                              />
                              <span>Select All ({filteredLocations.length})</span>
                            </div>
                          </label>

                          {(showAllLocations ? filteredLocations : filteredLocations.slice(0, 5)).map(loc => (
                            <label key={loc} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded">
                              <div class="flex items-center gap-2">
                                <input 
                                  type="checkbox" 
                                  checked={selectedLocations.includes(loc)} 
                                  onChange={() => toggleFilter(loc, selectedLocations, setSelectedLocations)}
                                  class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" 
                                />
                                <span class="truncate max-w-[120px]">{loc}</span>
                              </div>
                              <span class="text-slate-400 font-mono">{formatCount(locationCounts[loc])}</span>
                            </label>
                          ))}
                        </>
                      )}

                      {filteredLocations.length > 5 && (
                        <button 
                          onClick={() => setShowAllLocations(!showAllLocations)} 
                          class="text-xs text-blue-600 hover:underline font-medium block pt-1"
                        >
                          {showAllLocations ? 'See Less' : 'See More'}
                        </button>
                      )}

                      {filteredLocations.length > 0 && (
                        <div class="pt-2">
                          <input
                            type="text"
                            placeholder="Search location"
                            value={locationSearch}
                            onChange={(e) => setLocationSearch(e.target.value)}
                            class="w-full px-2.5 py-1 bg-white border border-slate-200 rounded text-xs focus:outline-none focus:border-blue-500"
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Industry Filter */}
                <div class="border-b border-slate-100 pb-4">
                  <div 
                    onClick={() => toggleSection('industry')} 
                    class="flex justify-between items-center cursor-pointer mb-2 text-slate-800 font-semibold text-sm"
                  >
                    <span>Industry</span>
                    <span class="text-xs text-slate-400">{openSections.industry ? '▲' : '▼'}</span>
                  </div>

                  {openSections.industry && (
                    <div class="space-y-2 mt-2">
                      {filteredIndustries.length === 0 ? (
                        <p class="text-xs text-slate-400 italic">No industries available</p>
                      ) : (
                        <>
                          <label class="flex items-center justify-between text-xs text-blue-600 font-semibold cursor-pointer hover:bg-blue-50 p-1 rounded border-b border-slate-100 mb-1">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={filteredIndustries.length > 0 && filteredIndustries.every(ind => selectedIndustries.includes(ind))} 
                                onChange={toggleSelectAllIndustries}
                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" 
                              />
                              <span>Select All ({filteredIndustries.length})</span>
                            </div>
                          </label>

                          {(showAllIndustries ? filteredIndustries : filteredIndustries.slice(0, 5)).map(ind => (
                            <label key={ind} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded">
                              <div class="flex items-center gap-2">
                                <input 
                                  type="checkbox" 
                                  checked={selectedIndustries.includes(ind)} 
                                  onChange={() => toggleFilter(ind, selectedIndustries, setSelectedIndustries)}
                                  class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" 
                                />
                                <span class="truncate max-w-[120px]">{ind}</span>
                              </div>
                              <span class="text-slate-400 font-mono">{formatCount(industryCounts[ind])}</span>
                            </label>
                          ))}
                        </>
                      )}

                      {filteredIndustries.length > 5 && (
                        <button 
                          onClick={() => setShowAllIndustries(!showAllIndustries)} 
                          class="text-xs text-blue-600 hover:underline font-medium block pt-1"
                        >
                          {showAllIndustries ? 'See Less' : 'See More'}
                        </button>
                      )}

                      {filteredIndustries.length > 0 && (
                        <div class="pt-2">
                          <input
                            type="text"
                            placeholder="Search industry"
                            value={industrySearch}
                            onChange={(e) => setIndustrySearch(e.target.value)}
                            class="w-full px-2.5 py-1 bg-white border border-slate-200 rounded text-xs focus:outline-none focus:border-blue-500"
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Keywords / Tags Filter */}
                <div class="pb-2">
                  <div 
                    onClick={() => toggleSection('tags')} 
                    class="flex justify-between items-center cursor-pointer mb-2 text-slate-800 font-semibold text-sm"
                  >
                    <span>Keywords / Tags</span>
                    <span class="text-xs text-slate-400">{openSections.tags ? '▲' : '▼'}</span>
                  </div>

                  {openSections.tags && (
                    <div class="space-y-2 mt-2">
                      {filteredTagsList.length === 0 ? (
                        <p class="text-xs text-slate-400 italic">No tags available</p>
                      ) : (
                        <>
                          <label class="flex items-center justify-between text-xs text-blue-600 font-semibold cursor-pointer hover:bg-blue-50 p-1 rounded border-b border-slate-100 mb-1">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={filteredTagsList.length > 0 && filteredTagsList.every(tag => selectedTags.includes(tag))} 
                                onChange={toggleSelectAllTags}
                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" 
                              />
                              <span>Select All ({filteredTagsList.length})</span>
                            </div>
                          </label>

                          {(showAllTags ? filteredTagsList : filteredTagsList.slice(0, 5)).map(tag => (
                            <label key={tag} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded">
                              <div class="flex items-center gap-2">
                                <input 
                                  type="checkbox" 
                                  checked={selectedTags.includes(tag)} 
                                  onChange={() => toggleFilter(tag, selectedTags, setSelectedTags)}
                                  class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" 
                                />
                                <span class="truncate max-w-[120px]">{tag}</span>
                              </div>
                              <span class="text-slate-400 font-mono">{formatCount(tagCounts[tag])}</span>
                            </label>
                          ))}
                        </>
                      )}

                      {filteredTagsList.length > 5 && (
                        <button 
                          onClick={() => setShowAllTags(!showAllTags)} 
                          class="text-xs text-blue-600 hover:underline font-medium block pt-1"
                        >
                          {showAllTags ? 'See Less' : 'See More'}
                        </button>
                      )}

                      {filteredTagsList.length > 0 && (
                        <div class="pt-2">
                          <input
                            type="text"
                            placeholder="Search tags"
                            value={tagSearch}
                            onChange={(e) => setTagSearch(e.target.value)}
                            class="w-full px-2.5 py-1 bg-white border border-slate-200 rounded text-xs focus:outline-none focus:border-blue-500"
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

              </div>
            </aside>

            {/* Main Content Area */}
            <main class="flex-1 p-6 overflow-y-auto">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="text-sm font-semibold text-slate-700">
                  {globalSearch.trim() !== "" ? `Search Results across All Tabs` : activeTab} ({filteredSamples.length})
                </h2>
              </div>

              {loading ? (
                <div class="flex justify-center items-center py-24 text-slate-400 text-sm">
                  Loading database records...
                </div>
              ) : filteredSamples.length === 0 ? (
                <div class="bg-white border border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
                  No samples found matching selected query or filters.
                </div>
              ) : (
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {filteredSamples.map(sample => (
                    <div 
                      key={sample.id} 
                      class="bg-white rounded-xl border border-slate-200/90 p-4 shadow-sm hover:shadow-md transition relative flex flex-col justify-between"
                    >
                      <div>
                        {/* Title & Tab Indicator Badge */}
                        <div class="flex justify-between items-start mb-2">
                          <h3 class="text-base font-bold text-slate-900 leading-tight">
                            {sample.sampleName}
                          </h3>
                          <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 shrink-0 ml-2">
                            Completed
                          </span>
                        </div>

                        {/* Search Source Tab Label (visible when global searching) */}
                        {globalSearch.trim() !== "" && (
                          <div class="mb-2">
                            <span class="bg-slate-100 text-slate-600 text-[10px] font-semibold px-2 py-0.5 rounded">
                              📁 {sample.tabName}
                            </span>
                          </div>
                        )}

                        {/* Detail Card Fields */}
                        <div class="space-y-1 my-3 text-xs">
                          <p class="text-slate-800"><span class="font-bold">Sample ID:</span> {sample.sampleId}</p>
                          
                          {sample.location && (
                            <p class="text-slate-800"><span class="font-bold">Location:</span> {sample.location}</p>
                          )}
                          
                          {sample.industry && (
                            <p class="text-slate-800"><span class="font-bold">Industry:</span> {sample.industry}</p>
                          )}
                          
                          {sample.tags && (
                            <div class="flex items-center gap-1.5 pt-1">
                              <span class="font-bold text-slate-800">Keywords/Tags:</span>
                              <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full text-[11px] font-medium truncate max-w-[150px]">
                                {sample.tags}
                              </span>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Google Sheet Link */}
                      <div class="flex items-center justify-between pt-3 border-t border-slate-100 mt-2">
                        <span class="text-xs text-slate-500 font-medium">Google Sheet Link:</span>
                        <a 
                          href={sample.sampleSheet} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          class="text-blue-600 hover:text-blue-800 text-xs font-semibold flex items-center gap-1 hover:underline"
                        >
                          <span>↗ Open Sheet</span>
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
