<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SHEET_ID = "142xiSUpVUdMGkFkzvyFBCPp5M0J_0AtAdHlCsCUWqkg";

    const SHEET_TABS = [
      "All Samples",
      "Government Contract Sample",
      "Exhibitor & Attendee Samples",
      "EXhibitior Count",
      "Business Email List Samples",
      "Funding Samples",
      "Location Wise Email List",
      "Doctors - Specialist Email List",
      "Industry Email List",
      "Title Email List",
      "Technology Users Email List",
      "E-Commerce Samples"
    ];

    // Authentic Specialist Email List dataset extracted from the Doctors tab as exact fallback / verify
    const DOCTORS_SPECIALIST_FALLBACK = [
      { name: "General Surgeon Email List", url: "https://docs.google.com/spreadsheets/d/1Qy6Dr9ZRVX7jLOSA7RInVh9IR60azNm8SLghW8YpjF8/edit?gid=1564292089#gid=1564292089" },
      { name: "Anesthesiologist Email List", url: "https://docs.google.com/spreadsheets/d/1LeViVd3s7wrHD3DEA4gGeb0RoThxbHjPAA8oz_CatFU/edit?gid=1564292089#gid=1564292089" },
      { name: "Endocrinologist Email List", url: "https://docs.google.com/spreadsheets/d/1je9LaztidmbQ8qjo9NAXIgr0EriaV9ERH5Ln4BKKaYU/edit?gid=1564292089#gid=1564292089" },
      { name: "Rheumatologist Email List", url: "https://docs.google.com/spreadsheets/d/1aBSB4QFfbLqE3v2oSgliHSKBjZdlQpilWGo-IWSVkI/edit?gid=580190905#gid=580190905" },
      { name: "Urologists Email List", url: "https://docs.google.com/spreadsheets/d/136O_jOeQrcPK5h0hi5bDBsaZcEmeRXxpOww08GxWWYM/edit?gid=1564292089#gid=1564292089" },
      { name: "Pathologists email list", url: "https://docs.google.com/spreadsheets/d/1Mp8byKzGhxA_BwySPQEXDona9Fths6yirBvPG8zTWes/edit?gid=1564292089#gid=1564292089" },
      { name: "Pulmonologists Email List", url: "https://docs.google.com/spreadsheets/d/1PhgzCW4YGKohfodZrNvvOhRouA7lj4pKov4txwdsQ/edit?gid=1564292089#gid=1564292089" },
      { name: "Traumatologist Email List", url: "https://docs.google.com/spreadsheets/d/1W6vTrnq6avJb0LVNMD4v57KBdc9LRmPRUCQSYv5i24s/edit?gid=1564292089#gid=1564292089" },
      { name: "Plastic Surgeons Email List", url: "https://docs.google.com/spreadsheets/d/1GKuiunYNcRKLwhoiqzGcYj4cVyZoCilRwlPNRAffsc/edit?gid=1564292089#gid=1564292089" },
      { name: "Hygienists Email List", url: "https://docs.google.com/spreadsheets/d/1Q2hHVQHJ4mQznSTF_ps15HnXYFI-TJXG_t5CYkH6FyY/edit?gid=1564292089#gid=1564292089" },
      { name: "Nutritionists Email List", url: "https://docs.google.com/spreadsheets/d/1qJbdMp85MK0PAGKOn-sMFV7XkCXnTUzRTh_Mpsr9ExE/edit?gid=1564292089#gid=1564292089" },
      { name: "Sleep Medicine Specialists Email List", url: "https://docs.google.com/spreadsheets/d/1-P8nUn42sljf7ko9KeK4mMulBn6HWXYF1aEm6FyopU/edit?gid=1564292089#gid=1564292089" },
      { name: "Hematologist Email List", url: "https://docs.google.com/spreadsheets/d/1GTQD3C1ZJJZ5_MQ8dp9EXRNSYIzc4TGRHD3wdCqRN4/edit?gid=1564292089#gid=1564292089" },
      { name: "Audiologist Email List", url: "https://docs.google.com/spreadsheets/d/1aM3ZQWcdTdd4BT6PpwN6KQUkbbq8p48-9MbXteM7kE0/edit?gid=1564292089#gid=1564292089" },
      { name: "Nephrologist Email List", url: "https://docs.google.com/spreadsheets/d/1RFv902XprUTg7PXWJenVUGrBeA9xQB-XRWY1t067IZc/edit?gid=1564292089#gid=1564292089" },
      { name: "Neonatologist Email List", url: "https://docs.google.com/spreadsheets/d/1mPg3DHRLVWCb9i-Os4LZWOjVvGhwrGx2e6ujziHy0E/edit?gid=1564292089#gid=1564292089" },
      { name: "Gastroenterologist Specialist Email List", url: "https://docs.google.com/spreadsheets/d/1NFHmenqOseC5zFLMlgZw5CZLJKOw_Cqv8pepyQcXmYQoXZTKA/edit?gid=1564292089#gid=1564292089" },
      { name: "Clinical Lipidologist Email List", url: "https://docs.google.com/spreadsheets/d/1WOAx1TV2lPNP3CEzFLMlgviwX5T2-yWo1ZqlqLcNpHY/edit?gid=1564292089#gid=1564292089" },
      { name: "Phlebotomist Email List", url: "https://docs.google.com/spreadsheets/d/1HcQT3w4oJJg2F3fgLgPWAAJ7lE1DWiTRn9u0hNi5CtA/edit?gid=1564292089#gid=1564292089" },
      { name: "Optician Email List", url: "https://docs.google.com/spreadsheets/d/1vtbTp8e18Ha3dRDREM5n8bASajXq5y6GUKHmeqzg6IWU/edit?gid=1564292089#gid=1564292089" },
      { name: "Psychiatrists Email List", url: "https://docs.google.com/spreadsheets/d/1TpnwXnB6OYUuu9cio2xdJgBoONBzWB_pys4Q6G7RK_Y/edit?gid=1564292089#gid=1564292089" },
      { name: "Naturopathic Doctors Email List", url: "https://docs.google.com/spreadsheets/d/1OfCGC5Z3WG9d2FC2cED5HOsqSJfSVIc3_tgW7c0GVKI/edit?gid=1564292089#gid=1564292089" },
      { name: "Neurosurgeon Email List", url: "https://docs.google.com/spreadsheets/d/1mQdQCTnfcAFTAxtey3-09odP1ZoevxpShJbVP3A5Wo/edit?gid=1564292089#gid=1564292089" },
      { name: "Epidemiologist Email List", url: "https://docs.google.com/spreadsheets/d/1WydgLJcEvp69JTyYjbKKewwQO53l3NmSscIpr3KiWE/edit?gid=1564292089#gid=1564292089" },
      { name: "Neuropathologist Email List", url: "https://docs.google.com/spreadsheets/d/1MdyznlmC4SG5I_X1URyrKv2I3XdlJkp1kHKwGAXFlOw/edit?gid=1564292089#gid=1564292089" },
      { name: "ENT Doctor Email List", url: "https://docs.google.com/spreadsheets/d/1VJAduCWKDw6ghYePOu_OCcW3R-giHEw7v_LilkwGvLc/edit?gid=1564292089#gid=1564292089" },
      { name: "Hypnotists Email List", url: "https://docs.google.com/spreadsheets/d/11_r3xcvjZEBWIGHcsgVngl6TTy40h-C_fzehUlFN5o0/edit?gid=1564292089#gid=1564292089" },
      { name: "Medical Geneticist Email List", url: "https://docs.google.com/spreadsheets/d/15mmL8rjrCQ0TNWN8KQKe6KDrnGCyHb_QpnZf8jblQAY/edit?gid=1564292089#gid=1564292089" },
      { name: "Oral Surgeons Email List", url: "https://docs.google.com/spreadsheets/d/1Ik2AIUCMH73zUheIR6kZT_SS-tYQOrFeJm8t6ZCaawk/edit?gid=1564292089#gid=1564292089" },
      { name: "Cosmetologists Email List", url: "https://docs.google.com/spreadsheets/d/1GBZJA2OplkgpFf8e9X-4oHNEvt6UvpwD5OUcNZNKFo/edit?gid=1564292089#gid=1564292089" },
      { name: "Allergist Email List", url: "https://docs.google.com/spreadsheets/d/100WVJCBCKRJU3rsdjoFuB38Ias-7sQzGMlhGU_I/edit?gid=1564292089#gid=1564292089" },
      { name: "Osteopathic Physicians Email List", url: "https://docs.google.com/spreadsheets/d/1PGLA-I7leHbDmfL6K6_4wfv4NR0d0FZzeoyR06NpNpM/edit?gid=1564292089#gid=1564292089" },
      { name: "Prosthodontist Email List", url: "https://docs.google.com/spreadsheets/d/1cCaM1R4uouKniKpWe-nWJ-uVY6fO4gRETsdhJqa4Bzm/edit?gid=1564292089#gid=1564292089" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState(SHEET_TABS[0]);
      const [allTabsData, setAllTabsData] = useState({});
      const [loading, setLoading] = useState(true);
      const [globalSearch, setGlobalSearch] = useState("");

      // Filter selections
      const [selectedLocations, setSelectedLocations] = useState([]);
      const [selectedIndustries, setSelectedIndustries] = useState([]);
      const [selectedTags, setSelectedTags] = useState([]);

      // Section open/close states
      const [openSections, setOpenSections] = useState({
        location: true,
        industry: true,
        tags: true
      });

      // Expand/Collapse "See More" states
      const [showAllLocations, setShowAllLocations] = useState(false);
      const [showAllIndustries, setShowAllIndustries] = useState(false);
      const [showAllTags, setShowAllTags] = useState(false);

      // Search queries for individual filters
      const [locationSearch, setLocationSearch] = useState("");
      const [industrySearch, setIndustrySearch] = useState("");
      const [tagSearch, setTagSearch] = useState("");

      useEffect(() => {
        fetchAllTabsData();
      }, []);

      const toggleSection = (section) => {
        setOpenSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const formatCount = (num) => {
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        return num.toString();
      };

      const cleanUrl = (rawStr) => {
        if (!rawStr) return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
        let str = String(rawStr).trim();
        const urlMatch = str.match(/https?:\/\/[^\s"']+/i);
        if (urlMatch) return urlMatch[0];

        if (str.includes('docs.google.com') || str.includes('spreadsheets')) {
          if (!str.startsWith('http')) return 'https://' + str;
          return str;
        }

        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
      };

      const fetchAllTabsData = () => {
        setLoading(true);
        const cacheBuster = new Date().getTime();
        let loadedData = {};
        let fetchCount = 0;

        SHEET_TABS.forEach(tabName => {
          const sheetParam = `&sheet=${encodeURIComponent(tabName)}`;
          const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${sheetParam}&_=${cacheBuster}`;

          Papa.parse(gvizUrl, {
            download: true,
            header: false,
            skipEmptyLines: 'greedy',
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                const parsed = parseRows(results.data, tabName);
                
                // Guard Against GViz API Default Redirect to "All Samples" for Doctors Tab
                if (tabName === "Doctors - Specialist Email List") {
                  const isAllSamplesDuplicate = parsed.some(item => item.sampleName === "AK-MH Doe" || item.sampleName === "Mirror LED Light manufacture");
                  if (isAllSamplesDuplicate || parsed.length === 0) {
                    loadedData[tabName] = DOCTORS_SPECIALIST_FALLBACK.map((doc, idx) => ({
                      id: `${tabName}-${idx}`,
                      tabName: tabName,
                      sampleId: doc.name,
                      sampleName: doc.name,
                      sampleSheet: doc.url,
                      clientRequirement: '-',
                      tags: 'Medical & Doctors',
                      industry: 'Healthcare / Medical',
                      location: 'United States',
                      projectStatus: 'Completed'
                    }));
                  } else {
                    loadedData[tabName] = parsed;
                  }
                } else {
                  loadedData[tabName] = parsed;
                }
              } else {
                if (tabName === "Doctors - Specialist Email List") {
                  loadedData[tabName] = DOCTORS_SPECIALIST_FALLBACK.map((doc, idx) => ({
                    id: `${tabName}-${idx}`,
                    tabName: tabName,
                    sampleId: doc.name,
                    sampleName: doc.name,
                    sampleSheet: doc.url,
                    clientRequirement: '-',
                    tags: 'Medical & Doctors',
                    industry: 'Healthcare / Medical',
                    location: 'United States',
                    projectStatus: 'Completed'
                  }));
                } else {
                  loadedData[tabName] = [];
                }
              }
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            },
            error: () => {
              if (tabName === "Doctors - Specialist Email List") {
                loadedData[tabName] = DOCTORS_SPECIALIST_FALLBACK.map((doc, idx) => ({
                  id: `${tabName}-${idx}`,
                  tabName: tabName,
                  sampleId: doc.name,
                  sampleName: doc.name,
                  sampleSheet: doc.url,
                  clientRequirement: '-',
                  tags: 'Medical & Doctors',
                  industry: 'Healthcare / Medical',
                  location: 'United States',
                  projectStatus: 'Completed'
                }));
              } else {
                loadedData[tabName] = [];
              }
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            }
          });
        });
      };

      const parseRows = (rawRows, tabName) => {
        if (!rawRows || rawRows.length === 0) return [];

        let headerIndex = -1;
        let colMap = { id: -1, name: -1, url: -1, clientReq: -1, tags: -1, industry: -1, location: -1 };

        // Inspect header row up to row 10
        for (let i = 0; i < Math.min(10, rawRows.length); i++) {
          const rowStr = rawRows[i].map(c => String(c).toLowerCase()).join(' ');
          if (rowStr.includes('sample') || rowStr.includes('name') || rowStr.includes('location') || rowStr.includes('link') || rowStr.includes('url') || rowStr.includes('title')) {
            headerIndex = i;
            rawRows[i].forEach((cell, colIdx) => {
              const c = String(cell).toLowerCase().trim();
              if (c.includes('id') || c.includes('sr') || c.includes('no')) colMap.id = colIdx;
              if (c.includes('sample') || c.includes('name') || c.includes('title') || c === 'samples') {
                if (colMap.name === -1) colMap.name = colIdx;
              }
              if (c.includes('link') || c.includes('url') || c.includes('sheet')) colMap.url = colIdx;
              if (c.includes('req') || c.includes('client')) colMap.clientReq = colIdx;
              if (c.includes('tag') || c.includes('key')) colMap.tags = colIdx;
              if (c.includes('industry') || c.includes('category')) colMap.industry = colIdx;
              if (c.includes('location') || c.includes('city') || c.includes('country') || c.includes('state')) colMap.location = colIdx;
            });
            break;
          }
        }

        const startIndex = headerIndex >= 0 ? headerIndex + 1 : 0;
        const targetRows = rawRows.slice(startIndex);

        return targetRows.filter(row => row.some(cell => String(cell).trim() !== '')).map((row, idx) => {
          const getVal = (colIdx) => (colIdx >= 0 && row[colIdx]) ? String(row[colIdx]).trim() : '';

          const rawName = getVal(colMap.name) || (row[0] && !String(row[0]).includes('http') ? String(row[0]).trim() : `Sample Record ${idx + 1}`);
          const sampleId = getVal(colMap.id) || rawName;
          
          let rawSheetUrl = getVal(colMap.url);
          if (!rawSheetUrl || !rawSheetUrl.includes('http')) {
            const foundUrlCell = row.find(c => String(c).includes('http') || String(c).includes('docs.google.com') || String(c).includes('spreadsheets'));
            if (foundUrlCell) {
              rawSheetUrl = String(foundUrlCell);
            }
          }

          const location = getVal(colMap.location) || (tabName.includes('Doctors') ? 'United States' : '');
          const industry = getVal(colMap.industry) || (tabName.includes('Doctors') ? 'Healthcare / Medical' : '');
          const tags = getVal(colMap.tags) || (tabName.includes('Doctors') ? 'Medical & Doctors' : '');
          const clientReq = getVal(colMap.clientReq);

          return {
            id: `${tabName}-${idx}`,
            tabName: tabName,
            sampleId,
            sampleName: rawName,
            sampleSheet: cleanUrl(rawSheetUrl),
            clientRequirement: clientReq,
            tags: tags,
            industry: industry,
            location: location,
            projectStatus: 'Completed'
          };
        });
      };

      const currentScopeSamples = useMemo(() => {
        if (globalSearch.trim() !== "") {
          return Object.values(allTabsData).flat();
        }
        return allTabsData[activeTab] || [];
      }, [allTabsData, activeTab, globalSearch]);

      const locationCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.location) counts[s.location] = (counts[s.location] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const industryCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.industry) counts[s.industry] = (counts[s.industry] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const tagCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.tags) counts[s.tags] = (counts[s.tags] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const filteredLocations = useMemo(() => {
        return Object.keys(locationCounts).filter(loc => 
          loc.toLowerCase().includes(locationSearch.toLowerCase())
        );
      }, [locationCounts, locationSearch]);

      const filteredIndustries = useMemo(() => {
        return Object.keys(industryCounts).filter(ind => 
          ind.toLowerCase().includes(industrySearch.toLowerCase())
        );
      }, [industryCounts, industrySearch]);

      const filteredTagsList = useMemo(() => {
        return Object.keys(tagCounts).filter(tag => 
          tag.toLowerCase().includes(tagSearch.toLowerCase())
        );
      }, [tagCounts, tagSearch]);

      const toggleSelectAllLocations = () => {
        const allSelected = filteredLocations.every(loc => selectedLocations.includes(loc));
        if (allSelected) {
          setSelectedLocations(prev => prev.filter(loc => !filteredLocations.includes(loc)));
        } else {
          setSelectedLocations(prev => Array.from(new Set([...prev, ...filteredLocations])));
        }
      };

      const toggleSelectAllIndustries = () => {
        const allSelected = filteredIndustries.every(ind => selectedIndustries.includes(ind));
        if (allSelected) {
          setSelectedIndustries(prev => prev.filter(ind => !filteredIndustries.includes(ind)));
        } else {
          setSelectedIndustries(prev => Array.from(new Set([...prev, ...filteredIndustries])));
        }
      };

      const toggleSelectAllTags = () => {
        const allSelected = filteredTagsList.every(tag => selectedTags.includes(tag));
        if (allSelected) {
          setSelectedTags(prev => prev.filter(tag => !filteredTagsList.includes(tag)));
        } else {
          setSelectedTags(prev => Array.from(new Set([...prev, ...filteredTagsList])));
        }
      };

      const filteredSamples = useMemo(() => {
        return currentScopeSamples.filter(item => {
          const search = globalSearch.toLowerCase().trim();
          const matchesGlobalSearch = search === "" || 
            (item.sampleName && item.sampleName.toLowerCase().includes(search)) ||
            (item.sampleId && item.sampleId.toLowerCase().includes(search)) ||
            (item.location && item.location.toLowerCase().includes(search)) ||
            (item.industry && item.industry.toLowerCase().includes(search)) ||
            (item.tags && item.tags.toLowerCase().includes(search)) ||
            (item.tabName && item.tabName.toLowerCase().includes(search));

          const matchesLocation = selectedLocations.length === 0 || (item.location && selectedLocations.includes(item.location));
          const matchesIndustry = selectedIndustries.length === 0 || (item.industry && selectedIndustries.includes(item.industry));
          const matchesTags = selectedTags.length === 0 || (item.tags && selectedTags.includes(item.tags));

          return matchesGlobalSearch && matchesLocation && matchesIndustry && matchesTags;
        });
      }, [currentScopeSamples, globalSearch, selectedLocations, selectedIndustries, selectedTags]);

      const toggleFilter = (item, list, setList) => {
        setList(prev => prev.includes(item) ? prev.filter(x => x !== item) : [...prev, item]);
      };

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        setGlobalSearch("");
        setSelectedLocations([]);
        setSelectedIndustries([]);
        setSelectedTags([]);
        setLocationSearch("");
        setIndustrySearch("");
        setTagSearch("");
      };

      return (
        <div class="min-h-screen flex flex-col bg-[#F8FAFC]">
          {/* Header */}
          <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between gap-4 sticky top-0 z-30 shadow-xs">
            <div class="flex items-center space-x-3">
              <div class="p-2 bg-blue-600 text-white rounded-lg font-bold text-xs flex items-center justify-center shadow-xs">
                ST
              </div>
              <div>
                <h1 class="text-base font-bold text-slate-900 leading-tight">Sample Tracking Dashboard</h1>
                <p class="text-[11px] text-slate-500">Live synchronized sheet view</p>
              </div>
            </div>

            <div class="flex-1 max-w-xl">
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">🔍</span>
                <input
                  type="text"
                  placeholder="Search across all 12 tabs..."
                  value={globalSearch}
                  onChange={(e) => setGlobalSearch(e.target.value)}
                  class="w-full pl-8 pr-4 py-1.5 bg-slate-100/80 border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-1 focus:ring-blue-500 transition-all"
                />
              </div>
            </div>

            <div class="flex items-center space-x-3 text-xs text-slate-500">
              <span class="inline-flex items-center text-emerald-600 font-medium bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 text-[11px]">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5 animate-pulse"></span>
                Sync complete
              </span>
              <button 
                onClick={fetchAllTabsData} 
                class="p-1.5 hover:bg-slate-100 rounded-lg border border-slate-200 text-slate-600 transition-colors" 
                title="Refresh Data"
              >
                🔄
              </button>
            </div>
          </header>

          {/* 12 Tabs Navigation Bar */}
          <div class="bg-white border-b border-slate-200 px-6 overflow-x-auto whitespace-nowrap shadow-2xs no-scrollbar">
            <div class="flex space-x-1 py-1.5">
              {SHEET_TABS.map((tab) => {
                const isActive = activeTab === tab && globalSearch.trim() === "";
                return (
                  <button
                    key={tab}
                    onClick={() => handleTabChange(tab)}
                    class={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                      isActive 
                        ? 'bg-blue-600 text-white shadow-xs' 
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    {tab}
                  </button>
                );
              })}
            </div>
          </div>

          <div class="flex flex-1">
            {/* Sidebar Filters */}
            <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 select-none">
              <div class="p-4 space-y-5 overflow-y-auto flex-1">
                
                {/* Location Filter */}
                <div class="border-b border-slate-100 pb-4">
                  <div 
                    onClick={() => toggleSection('location')} 
                    class="flex justify-between items-center cursor-pointer mb-2 text-slate-800 font-semibold text-xs uppercase tracking-wider"
                  >
                    <span>Location</span>
                    <span class="text-xs text-slate-400">{openSections.location ? '▲' : '▼'}</span>
                  </div>

                  {openSections.location && (
                    <div class="space-y-2 mt-2">
                      {filteredLocations.length === 0 ? (
                        <p class="text-[11px] text-slate-400 italic">No locations available</p>
                      ) : (
                        <>
                          <label class="flex items-center justify-between text-xs text-blue-600 font-semibold cursor-pointer hover:bg-blue-50 p-1 rounded border-b border-slate-100 mb-1">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={filteredLocations.length > 0 && filteredLocations.every(loc => selectedLocations.includes(loc))} 
                                onChange={toggleSelectAllLocations}
                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5" 
                              />
                              <span class="text-[11px]">Select All ({filteredLocations.length})</span>
                            </div>
                          </label>

                          {(showAllLocations ? filteredLocations : filteredLocations.slice(0, 5)).map(loc => (
                            <label key={loc} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded transition-colors">
                              <div class="flex items-center gap-2">
                                <input 
                                  type="checkbox" 
                                  checked={selectedLocations.includes(loc)} 
                                  onChange={() => toggleFilter(loc, selectedLocations, setSelectedLocations)}
                                  class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5" 
                                />
                                <span class="truncate max-w-[120px] text-xs">{loc}</span>
                              </div>
                              <span class="text-slate-400 font-mono text-[11px]">{formatCount(locationCounts[loc])}</span>
                            </label>
                          ))}
                        </>
                      )}

                      {filteredLocations.length > 5 && (
                        <button 
                          onClick={() => setShowAllLocations(!showAllLocations)} 
                          class="text-[11px] text-blue-600 hover:underline font-medium block pt-1"
                        >
                          {showAllLocations ? 'See Less' : 'See More'}
                        </button>
                      )}

                      {filteredLocations.length > 0 && (
                        <div class="pt-2">
                          <input
                            type="text"
                            placeholder="Search location..."
                            value={locationSearch}
                            onChange={(e) => setLocationSearch(e.target.value)}
                            class="w-full px-2.5 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] focus:outline-none focus:bg-white focus:border-blue-500"
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Industry Filter */}
                <div class="border-b border-slate-100 pb-4">
                  <div 
                    onClick={() => toggleSection('industry')} 
                    class="flex justify-between items-center cursor-pointer mb-2 text-slate-800 font-semibold text-xs uppercase tracking-wider"
                  >
                    <span>Industry</span>
                    <span class="text-xs text-slate-400">{openSections.industry ? '▲' : '▼'}</span>
                  </div>

                  {openSections.industry && (
                    <div class="space-y-2 mt-2">
                      {filteredIndustries.length === 0 ? (
                        <p class="text-[11px] text-slate-400 italic">No industries available</p>
                      ) : (
                        <>
                          <label class="flex items-center justify-between text-xs text-blue-600 font-semibold cursor-pointer hover:bg-blue-50 p-1 rounded border-b border-slate-100 mb-1">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={filteredIndustries.length > 0 && filteredIndustries.every(ind => selectedIndustries.includes(ind))} 
                                onChange={toggleSelectAllIndustries}
                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5" 
                              />
                              <span class="text-[11px]">Select All ({filteredIndustries.length})</span>
                            </div>
                          </label>

                          {(showAllIndustries ? filteredIndustries : filteredIndustries.slice(0, 5)).map(ind => (
                            <label key={ind} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded transition-colors">
                              <div class="flex items-center gap-2">
                                <input 
                                  type="checkbox" 
                                  checked={selectedIndustries.includes(ind)} 
                                  onChange={() => toggleFilter(ind, selectedIndustries, setSelectedIndustries)}
                                  class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5" 
                                />
                                <span class="truncate max-w-[120px] text-xs">{ind}</span>
                              </div>
                              <span class="text-slate-400 font-mono text-[11px]">{formatCount(industryCounts[ind])}</span>
                            </label>
                          ))}
                        </>
                      )}

                      {filteredIndustries.length > 5 && (
                        <button 
                          onClick={() => setShowAllIndustries(!showAllIndustries)} 
                          class="text-[11px] text-blue-600 hover:underline font-medium block pt-1"
                        >
                          {showAllIndustries ? 'See Less' : 'See More'}
                        </button>
                      )}

                      {filteredIndustries.length > 0 && (
                        <div class="pt-2">
                          <input
                            type="text"
                            placeholder="Search industry..."
                            value={industrySearch}
                            onChange={(e) => setIndustrySearch(e.target.value)}
                            class="w-full px-2.5 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] focus:outline-none focus:bg-white focus:border-blue-500"
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Keywords / Tags Filter */}
                <div class="pb-2">
                  <div 
                    onClick={() => toggleSection('tags')} 
                    class="flex justify-between items-center cursor-pointer mb-2 text-slate-800 font-semibold text-xs uppercase tracking-wider"
                  >
                    <span>Keywords / Tags</span>
                    <span class="text-xs text-slate-400">{openSections.tags ? '▲' : '▼'}</span>
                  </div>

                  {openSections.tags && (
                    <div class="space-y-2 mt-2">
                      {filteredTagsList.length === 0 ? (
                        <p class="text-[11px] text-slate-400 italic">No tags available</p>
                      ) : (
                        <>
                          <label class="flex items-center justify-between text-xs text-blue-600 font-semibold cursor-pointer hover:bg-blue-50 p-1 rounded border-b border-slate-100 mb-1">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={filteredTagsList.length > 0 && filteredTagsList.every(tag => selectedTags.includes(tag))} 
                                onChange={toggleSelectAllTags}
                                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5" 
                              />
                              <span class="text-[11px]">Select All ({filteredTagsList.length})</span>
                            </div>
                          </label>

                          {(showAllTags ? filteredTagsList : filteredTagsList.slice(0, 5)).map(tag => (
                            <label key={tag} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded transition-colors">
                              <div class="flex items-center gap-2">
                                <input 
                                  type="checkbox" 
                                  checked={selectedTags.includes(tag)} 
                                  onChange={() => toggleFilter(tag, selectedTags, setSelectedTags)}
                                  class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5" 
                                />
                                <span class="truncate max-w-[120px] text-xs">{tag}</span>
                              </div>
                              <span class="text-slate-400 font-mono text-[11px]">{formatCount(tagCounts[tag])}</span>
                            </label>
                          ))}
                        </>
                      )}

                      {filteredTagsList.length > 5 && (
                        <button 
                          onClick={() => setShowAllTags(!showAllTags)} 
                          class="text-[11px] text-blue-600 hover:underline font-medium block pt-1"
                        >
                          {showAllTags ? 'See Less' : 'See More'}
                        </button>
                      )}

                      {filteredTagsList.length > 0 && (
                        <div class="pt-2">
                          <input
                            type="text"
                            placeholder="Search tags..."
                            value={tagSearch}
                            onChange={(e) => setTagSearch(e.target.value)}
                            class="w-full px-2.5 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] focus:outline-none focus:bg-white focus:border-blue-500"
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

              </div>
            </aside>

            {/* Main Content Area */}
            <main class="flex-1 p-6 overflow-y-auto">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-800">
                  {globalSearch.trim() !== "" ? `Search Results across All Tabs` : activeTab} ({filteredSamples.length})
                </h2>
              </div>

              {loading ? (
                <div class="flex justify-center items-center py-28 text-slate-400 text-xs">
                  Loading database records...
                </div>
              ) : filteredSamples.length === 0 ? (
                <div class="bg-white border border-slate-200 rounded-xl p-10 text-center text-slate-400 text-xs">
                  No samples found matching selected query or filters.
                </div>
              ) : (
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {filteredSamples.map(sample => (
                    <div 
                      key={sample.id} 
                      class="bg-white rounded-xl border border-slate-200/90 p-4 shadow-2xs hover:shadow-md transition-all flex flex-col justify-between group"
                    >
                      <div>
                        {/* Title & Status Badge */}
                        <div class="flex justify-between items-start mb-2">
                          <h3 class="text-base font-bold text-slate-900 leading-snug group-hover:text-blue-600 transition-colors">
                            {sample.sampleName}
                          </h3>
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 shrink-0 ml-2">
                            Completed
                          </span>
                        </div>

                        {/* Search Source Tab Label (visible when global searching) */}
                        {globalSearch.trim() !== "" && (
                          <div class="mb-2">
                            <span class="bg-slate-100 text-slate-600 text-[10px] font-semibold px-2 py-0.5 rounded border border-slate-200">
                              📁 {sample.tabName}
                            </span>
                          </div>
                        )}

                        {/* Detail Card Fields */}
                        <div class="space-y-1.5 my-3 text-xs text-slate-700">
                          <p class="truncate"><span class="font-semibold text-slate-900">Sample ID:</span> {sample.sampleId}</p>
                          
                          {sample.location && (
                            <p><span class="font-semibold text-slate-900">Location:</span> {sample.location}</p>
                          )}
                          
                          {sample.industry && (
                            <p class="truncate"><span class="font-semibold text-slate-900">Industry:</span> {sample.industry}</p>
                          )}
                          
                          {sample.tags && (
                            <div class="flex items-center gap-1.5 pt-1 flex-wrap">
                              <span class="font-semibold text-slate-900">Keywords/Tags:</span>
                              <span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-full text-[10px] font-medium inline-flex items-center">
                                {sample.tags}
                              </span>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Google Sheet Link */}
                      <div class="flex items-center justify-between pt-3 border-t border-slate-100 text-xs mt-2">
                        <span class="text-[11px] text-slate-400 font-mono truncate max-w-[140px]">
                          {sample.sampleSheet.replace('https://', '')}
                        </span>
                        <a 
                          href={sample.sampleSheet} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          class="inline-flex items-center text-xs font-semibold text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-2 py-1 rounded-md transition"
                        >
                          <span>Open Sheet ↗</span>
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
