<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Tracking Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SHEET_ID = "142xiSUpVUdMGkFkzvyFBCPp5M0J_0AtAdHlCsCUWqkg";

    const SHEET_TABS = [
      "All Samples",
      "Government Contract Sample",
      "Exhibitor & Attendee Samples",
      "EXhibitior Count",
      "Business Email List Samples",
      "Funding Samples",
      "Location Wise Email List",
      "Doctors - Specialist Email List",
      "Industry Email List",
      "Title Email List",
      "Technology Users Email List",
      "E-Commerce Samples"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState(SHEET_TABS[0]);
      const [allTabsData, setAllTabsData] = useState({});
      const [loading, setLoading] = useState(true);
      const [globalSearch, setGlobalSearch] = useState("");

      const [selectedLocations, setSelectedLocations] = useState([]);
      const [selectedIndustries, setSelectedIndustries] = useState([]);
      const [selectedTags, setSelectedTags] = useState([]);

      const [openSections, setOpenSections] = useState({ location: true, industry: true, tags: true });
      const [showAllLocations, setShowAllLocations] = useState(false);
      const [showAllIndustries, setShowAllIndustries] = useState(false);
      const [showAllTags, setShowAllTags] = useState(false);

      const [locationSearch, setLocationSearch] = useState("");
      const [industrySearch, setIndustrySearch] = useState("");
      const [tagSearch, setTagSearch] = useState("");

      useEffect(() => {
        fetchAllTabsData();
      }, []);

      const cleanUrl = (rawStr) => {
        if (!rawStr) return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
        let str = String(rawStr).trim();
        const urlMatch = str.match(/https?:\/\/[^\s"']+/i);
        if (urlMatch) return urlMatch[0];
        if (str.includes('docs.google.com') || str.includes('spreadsheets')) {
          return str.startsWith('http') ? str : 'https://' + str;
        }
        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
      };

      const fetchAllTabsData = () => {
        setLoading(true);
        const cacheBuster = new Date().getTime();
        let loadedData = {};
        let fetchCount = 0;

        SHEET_TABS.forEach(tabName => {
          const sheetParam = `&sheet=${encodeURIComponent(tabName)}`;
          const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${sheetParam}&_=${cacheBuster}`;

          Papa.parse(gvizUrl, {
            download: true,
            header: false,
            skipEmptyLines: 'greedy',
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                loadedData[tabName] = parseRows(results.data, tabName);
              } else {
                loadedData[tabName] = [];
              }
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            },
            error: () => {
              loadedData[tabName] = [];
              fetchCount++;
              if (fetchCount === SHEET_TABS.length) {
                setAllTabsData(loadedData);
                setLoading(false);
              }
            }
          });
        });
      };

      const parseRows = (rawRows, tabName) => {
        if (!rawRows || rawRows.length === 0) return [];

        let headerIdx = -1;
        let colMap = { name: -1, url: -1, id: -1, clientReq: -1, tags: -1, industry: -1, location: -1 };

        for (let i = 0; i < Math.min(5, rawRows.length); i++) {
          const rowStr = rawRows[i].map(c => String(c).toLowerCase()).join(' ');
          if (rowStr.includes('sample') || rowStr.includes('title') || rowStr.includes('name') || rowStr.includes('link') || rowStr.includes('url')) {
            headerIdx = i;
            rawRows[i].forEach((cell, cIdx) => {
              const c = String(cell).toLowerCase().trim();
              if (c.includes('id') || c.includes('sr')) colMap.id = cIdx;
              if (c.includes('name') || c.includes('title') || c.includes('sample')) { if(colMap.name === -1) colMap.name = cIdx; }
              if (c.includes('link') || c.includes('url') || c.includes('sheet')) colMap.url = cIdx;
              if (c.includes('req') || c.includes('client')) colMap.clientReq = cIdx;
              if (c.includes('tag') || c.includes('key')) colMap.tags = cIdx;
              if (c.includes('industry')) colMap.industry = cIdx;
              if (c.includes('location') || c.includes('country') || c.includes('state')) colMap.location = cIdx;
            });
            break;
          }
        }

        const startIndex = headerIdx >= 0 ? headerIdx + 1 : 0;
        const targetRows = rawRows.slice(startIndex);

        return targetRows
          .filter(row => row.some(cell => String(cell).trim() !== ''))
          .map((row, idx) => {
            const getVal = (col) => (col >= 0 && row[col]) ? String(row[col]).trim() : '';

            // Title detection logic
            let name = getVal(colMap.name);
            if (!name) {
              const firstNonUrl = row.find(cell => {
                const s = String(cell).trim();
                return s !== '' && !s.includes('http') && !s.includes('docs.google.com');
              });
              name = firstNonUrl ? String(firstNonUrl).trim() : `Sample ${idx + 1}`;
            }

            // URL detection logic
            let url = getVal(colMap.url);
            if (!url || (!url.includes('http') && !url.includes('docs.google.com'))) {
              const foundUrl = row.find(cell => String(cell).includes('http') || String(cell).includes('docs.google.com'));
              if (foundUrl) url = String(foundUrl);
            }

            return {
              id: `${tabName}-${idx}`,
              tabName: tabName,
              sampleId: getVal(colMap.id),
              sampleName: name,
              sampleSheet: cleanUrl(url),
              clientRequirement: getVal(colMap.clientReq),
              tags: getVal(colMap.tags),
              industry: getVal(colMap.industry),
              location: getVal(colMap.location)
            };
          });
      };

      // Current tab samples
      const currentScopeSamples = useMemo(() => {
        if (globalSearch.trim() !== "") {
          return Object.values(allTabsData).flat();
        }
        return allTabsData[activeTab] || [];
      }, [allTabsData, activeTab, globalSearch]);

      // Dynamic filter counts ONLY from current active tab/scope
      const locationCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.location) counts[s.location] = (counts[s.location] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const industryCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.industry) counts[s.industry] = (counts[s.industry] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const tagCounts = useMemo(() => {
        const counts = {};
        currentScopeSamples.forEach(s => {
          if (s.tags) counts[s.tags] = (counts[s.tags] || 0) + 1;
        });
        return counts;
      }, [currentScopeSamples]);

      const filteredLocations = useMemo(() => {
        return Object.keys(locationCounts).filter(loc => loc.toLowerCase().includes(locationSearch.toLowerCase()));
      }, [locationCounts, locationSearch]);

      const filteredIndustries = useMemo(() => {
        return Object.keys(industryCounts).filter(ind => ind.toLowerCase().includes(industrySearch.toLowerCase()));
      }, [industryCounts, industrySearch]);

      const filteredTagsList = useMemo(() => {
        return Object.keys(tagCounts).filter(tag => tag.toLowerCase().includes(tagSearch.toLowerCase()));
      }, [tagCounts, tagSearch]);

      const filteredSamples = useMemo(() => {
        return currentScopeSamples.filter(item => {
          const search = globalSearch.toLowerCase().trim();
          const matchesGlobal = search === "" || 
            (item.sampleName && item.sampleName.toLowerCase().includes(search)) ||
            (item.sampleId && item.sampleId.toLowerCase().includes(search)) ||
            (item.location && item.location.toLowerCase().includes(search)) ||
            (item.industry && item.industry.toLowerCase().includes(search)) ||
            (item.tags && item.tags.toLowerCase().includes(search)) ||
            (item.tabName && item.tabName.toLowerCase().includes(search));

          const matchesLoc = selectedLocations.length === 0 || (item.location && selectedLocations.includes(item.location));
          const matchesInd = selectedIndustries.length === 0 || (item.industry && selectedIndustries.includes(item.industry));
          const matchesTag = selectedTags.length === 0 || (item.tags && selectedTags.includes(item.tags));

          return matchesGlobal && matchesLoc && matchesInd && matchesTag;
        });
      }, [currentScopeSamples, globalSearch, selectedLocations, selectedIndustries, selectedTags]);

      const toggleFilter = (item, list, setList) => {
        setList(prev => prev.includes(item) ? prev.filter(x => x !== item) : [...prev, item]);
      };

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        setGlobalSearch(""); 
        setSelectedLocations([]);
        setSelectedIndustries([]);
        setSelectedTags([]);
        setLocationSearch("");
        setIndustrySearch("");
        setTagSearch("");
      };

      return (
        <div class="min-h-screen flex flex-col bg-[#F8FAFC]">
          {/* Header */}
          <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between gap-4 sticky top-0 z-30 shadow-sm">
            <div class="flex items-center space-x-3">
              <div class="p-1.5 bg-blue-600 text-white rounded font-bold text-sm">ST</div>
              <h1 class="text-base font-semibold text-slate-800">Sample Tracking Dashboard</h1>
            </div>

            <div class="flex-1 max-w-xl">
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">🔍</span>
                <input
                  type="text"
                  placeholder="Search across all 12 tabs..."
                  value={globalSearch}
                  onChange={(e) => setGlobalSearch(e.target.value)}
                  class="w-full pl-9 pr-4 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:bg-white focus:ring-1 focus:ring-blue-500"
                />
              </div>
            </div>

            <button onClick={fetchAllTabsData} class="p-2 hover:bg-slate-100 rounded-lg border border-slate-200 text-xs text-slate-600 font-medium">
              🔄 Refresh Data
            </button>
          </header>

          {/* Tabs */}
          <div class="bg-white border-b border-slate-200 px-6 overflow-x-auto whitespace-nowrap shadow-2xs">
            <div class="flex space-x-1 py-1">
              {SHEET_TABS.map((tab) => {
                const isActive = activeTab === tab && globalSearch.trim() === "";
                return (
                  <button
                    key={tab}
                    onClick={() => handleTabChange(tab)}
                    class={`px-3 py-2 text-xs font-medium rounded-md transition ${
                      isActive 
                        ? 'bg-blue-50 text-blue-600 font-semibold border-b-2 border-blue-600' 
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    {tab}
                  </button>
                );
              })}
            </div>
          </div>

          <div class="flex flex-1">
            {/* Sidebar Filters */}
            <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0">
              <div class="p-4 space-y-5 overflow-y-auto flex-1">
                
                {/* Location */}
                <div class="border-b border-slate-100 pb-4">
                  <div onClick={() => setOpenSections(p => ({...p, location: !p.location}))} class="flex justify-between items-center cursor-pointer mb-2 font-semibold text-sm">
                    <span>Location</span>
                    <span class="text-xs text-slate-400">{openSections.location ? '▲' : '▼'}</span>
                  </div>

                  {openSections.location && (
                    <div class="space-y-1.5 mt-2">
                      {filteredLocations.length === 0 ? (
                        <p class="text-xs text-slate-400 italic">No locations in this tab</p>
                      ) : (
                        (showAllLocations ? filteredLocations : filteredLocations.slice(0, 5)).map(loc => (
                          <label key={loc} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={selectedLocations.includes(loc)} 
                                onChange={() => toggleFilter(loc, selectedLocations, setSelectedLocations)}
                                class="rounded border-slate-300 text-blue-600" 
                              />
                              <span class="truncate max-w-[120px]">{loc}</span>
                            </div>
                            <span class="text-slate-400 font-mono">{locationCounts[loc]}</span>
                          </label>
                        ))
                      )}
                      {filteredLocations.length > 5 && (
                        <button onClick={() => setShowAllLocations(!showAllLocations)} class="text-xs text-blue-600 hover:underline pt-1 block">
                          {showAllLocations ? 'See Less' : 'See More'}
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {/* Industry */}
                <div class="border-b border-slate-100 pb-4">
                  <div onClick={() => setOpenSections(p => ({...p, industry: !p.industry}))} class="flex justify-between items-center cursor-pointer mb-2 font-semibold text-sm">
                    <span>Industry</span>
                    <span class="text-xs text-slate-400">{openSections.industry ? '▲' : '▼'}</span>
                  </div>

                  {openSections.industry && (
                    <div class="space-y-1.5 mt-2">
                      {filteredIndustries.length === 0 ? (
                        <p class="text-xs text-slate-400 italic">No industries in this tab</p>
                      ) : (
                        (showAllIndustries ? filteredIndustries : filteredIndustries.slice(0, 5)).map(ind => (
                          <label key={ind} class="flex items-center justify-between text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-1 rounded">
                            <div class="flex items-center gap-2">
                              <input 
                                type="checkbox" 
                                checked={selectedIndustries.includes(ind)} 
                                onChange={() => toggleFilter(ind, selectedIndustries, setSelectedIndustries)}
                                class="rounded border-slate-300 text-blue-600" 
                              />
                              <span class="truncate max-w-[120px]">{ind}</span>
                            </div>
                            <span class="text-slate-400 font-mono">{industryCounts[ind]}</span>
                          </label>
                        ))
                      )}
                      {filteredIndustries.length > 5 && (
                        <button onClick={() => setShowAllIndustries(!showAllIndustries)} class="text-xs text-blue-600 hover:underline pt-1 block">
                          {showAllIndustries ? 'See Less' : 'See More'}
                        </button>
                      )}
                    </div>
                  )}
                </div>

              </div>
            </aside>

            {/* Main Content */}
            <main class="flex-1 p-6 overflow-y-auto">
              <div class="mb-4">
                <h2 class="text-sm font-bold text-slate-700">
                  {globalSearch.trim() !== "" ? `Search Results Across All Tabs` : activeTab} ({filteredSamples.length})
                </h2>
              </div>

              {loading ? (
                <div class="flex justify-center items-center py-24 text-slate-400 text-sm">
                  Loading samples from sheet...
                </div>
              ) : filteredSamples.length === 0 ? (
                <div class="bg-white border border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
                  No sample records found for this tab.
                </div>
              ) : (
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {filteredSamples.map(sample => (
                    <div key={sample.id} class="bg-white rounded-xl border border-slate-200/90 p-4 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                      <div>
                        <h3 class="text-sm font-bold text-slate-900 leading-snug mb-2">
                          {sample.sampleName}
                        </h3>

                        {globalSearch.trim() !== "" && (
                          <span class="inline-block bg-slate-100 text-slate-600 text-[10px] font-semibold px-2 py-0.5 rounded mb-2">
                            📁 {sample.tabName}
                          </span>
                        )}

                        <div class="space-y-1 my-2 text-xs">
                          {sample.sampleId && <p class="text-slate-600"><span class="font-semibold text-slate-700">ID:</span> {sample.sampleId}</p>}
                          {sample.location && <p class="text-slate-600"><span class="font-semibold text-slate-700">Location:</span> {sample.location}</p>}
                          {sample.industry && <p class="text-slate-600"><span class="font-semibold text-slate-700">Industry:</span> {sample.industry}</p>}
                        </div>
                      </div>

                      <div class="flex items-center justify-between pt-3 border-t border-slate-100 mt-2 text-xs">
                        <span class="text-slate-400 font-medium">Sheet Link:</span>
                        <a 
                          href={sample.sampleSheet} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1 hover:underline"
                        >
                          ↗ Open Sheet
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
